name: orden
title: Orden
base: core24
version: '0.21.0'
summary: Markdown editor with live preview
description: |
  Orden, formerly nibeditor, is a small markdown editor that formats what you
  write as you write it.

  There is no split screen and no preview pane: headings, emphasis, lists,
  tables, code and math take their final shape in the same window you type in,
  and the markdown underneath stays plain text you can open anywhere.

  * Realtime inline preview, so the document always looks the way it will read
  * Notes that sync across your devices
  * An MCP server, so a language model can read and write your notes
  * Paste images straight from the clipboard
  * Publish a file as a page on the web, with a custom domain if you have one
  * Export to PDF and HTML

  Orden is free software under the GNU Affero General Public License. The same
  editor also runs in a browser at orden.so.
license: AGPL-3.0-only
website: https://orden.so
source-code: https://github.com/lxorb/orden
issues: https://github.com/lxorb/orden/issues
contact: https://github.com/lxorb/orden/issues

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  orden:
    command: usr/bin/orden
    desktop: usr/share/applications/orden.desktop
    extensions: [gnome]
    common-id: so.orden.Orden
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - browser-sandbox

plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true

parts:
  orden:
    plugin: dump
    source-type: deb
    source:
      - on amd64: https://github.com/lxorb/orden/releases/download/v0.21.0/Orden-0.21.0-linux-x64.deb
      - on arm64: https://github.com/lxorb/orden/releases/download/v0.21.0/Orden-0.21.0-linux-arm64.deb
    #   on amd64: sha256/094cf955889dc4e89563d92cd160acd8d163c9cce7ad04e88752c43d7e9f3a66
    #   on arm64: sha256/28b315db78cc2cecbc38d4bb7a56d33777b5a3dc3e69526b6b1a295d73bd149c
    source-checksum: sha256/094cf955889dc4e89563d92cd160acd8d163c9cce7ad04e88752c43d7e9f3a66
    override-build: |
      craftctl default

      if [ ! -e "${CRAFT_PART_INSTALL}/usr/bin/orden" ]; then
        ln -s nib "${CRAFT_PART_INSTALL}/usr/bin/orden"
      fi
      rm -f "${CRAFT_PART_INSTALL}/usr/share/applications/Nib.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/nibeditor.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/Orden.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/orden.desktop"
      install -d "${CRAFT_PART_INSTALL}/usr/share/applications"
      cat > "${CRAFT_PART_INSTALL}/usr/share/applications/orden.desktop" <<'DESKTOP'
      [Desktop Entry]
      Type=Application
      Name=Orden
      GenericName=Markdown Editor
      Comment=Write markdown and see it as you type
      Exec=orden %U
      Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/orden.png
      Terminal=false
      Categories=Office;TextEditor;Utility;
      MimeType=x-scheme-handler/http;x-scheme-handler/https;application/pdf;
      Keywords=markdown;md;editor;notes;writing;wysiwyg;nib;nibeditor;
      StartupWMClass=orden
      StartupNotify=true
      DESKTOP

      icons="${CRAFT_PART_INSTALL}/usr/share/icons/hicolor"
      for one in "${icons}"/*/apps/nib.png; do
        if [ -f "$one" ] && [ ! -e "${one%/nib.png}/orden.png" ]; then
          mv "$one" "${one%/nib.png}/orden.png"
        fi
      done
      if [ -f "${icons}/256x256@2/apps/orden.png" ]; then
        install -Dm644 "${icons}/256x256@2/apps/orden.png" "${icons}/256x256/apps/orden.png"
        rm -rf "${icons}/256x256@2"
      fi
