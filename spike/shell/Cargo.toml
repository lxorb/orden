# The spike that proves the recommendation: a Tauri window, two CEF webviews in
# it, one browser process.
#
# `tauri-runtime-cef` is a first-party Tauri runtime that puts CEF where
# `tauri-runtime-wry` puts WebView2 and WebKitGTK - so the app's own interface and
# a web tab are two webviews in one window on one engine, and the parts that are
# genuinely hard (the message pump, the macOS application class, the sandbox on
# three platforms, the bundle layout, the setuid helper in the deb and the rpm)
# are Tauri's code and not nib's. That is the whole argument in docs/browser.md.
#
# It is on a branch and not published, which is why this crate pins a revision and
# why batch 1 of the plan is a gate rather than a migration. When the crate
# releases, these three git dependencies become three version numbers.
[package]
name = "nib-spike-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "A Tauri window with two CEF webviews. A proof, not part of the app."

# A revision and not a branch. A spike whose job is to be a *gate* has to give the
# same answer twice, and `branch = "feat/cef"` moves under it - the branch took three
# commits on the day this was written.
[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1", features = [] }

[dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1", features = ["unstable"] }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1", features = [
  "unstable",
] }

# **This is a finding, not a tidy-up, and it is why batch 1 is a gate.**
#
# At revision c8c75b1 the branch does not build at all: `tauri` takes `dpi` from
# crates.io while `tauri-runtime-cef` takes `winit` from the `winit-gtk4` fork, which
# vendors a `dpi` of its own - so `platform/mod.rs` hands a
# `winit::dpi::PhysicalPosition<i32>` to something that wants
# `tauri::PhysicalPosition<i32>`, and eleven type errors fall out of one duplicated
# crate. Unifying the two on the fork's copy is the one-line repair; whether one line
# is the whole of it is exactly what this spike exists to find out, and either answer
# is worth having before a batch is planned around it. See docs/browser.md.
[patch.crates-io]
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }
