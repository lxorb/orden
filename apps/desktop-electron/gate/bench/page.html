<!doctype html><meta charset=utf-8><title>page</title>
<style>html,body{margin:0;height:100%;background:#00c800;overflow:hidden}
#edge{position:fixed;right:0;top:0;bottom:0;width:6px;background:#0000ff}
input{position:fixed;left:20px;width:200px;height:30px;font-size:20px;box-sizing:border-box}
#in{top:20px}#in2{top:60px}
#drag{position:fixed;left:20px;top:120px;width:200px;height:40px;background:#fff;font:20px sans-serif;line-height:40px;user-select:none}
#drop{position:fixed;left:20px;top:180px;width:200px;height:60px;background:#ddd;font:14px sans-serif}
#live{position:fixed;left:0;top:400px;width:20px;height:20px;background:#fff;animation:m 1s linear infinite alternate}
@keyframes m{to{transform:translateX(200px)}}</style>
<div id=edge></div><input id=in><input id=in2>
<div id=drag draggable=true>PAGEDRAG</div><div id=drop></div><div id=live></div>
<script>
window.dragLog={};for(const t of['dragstart','dragenter','dragover','drop','dragend'])addEventListener(t,()=>window.dragLog[t]=(window.dragLog[t]||0)+1,true);
window.keys=[];window.comp=[];window.drops=[];
addEventListener('keydown',e=>window.keys.push(e.key));
for(const t of['compositionstart','compositionupdate','compositionend'])addEventListener(t,e=>window.comp.push(t+':'+e.data));
document.getElementById('drag').addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','PAGEDRAG'));
const drop=document.getElementById('drop');
drop.addEventListener('dragover',e=>e.preventDefault());
drop.addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].map(x=>x.name+':'+x.size);window.drops.push({text:e.dataTransfer.getData('text/plain'),files:f});drop.textContent=JSON.stringify(window.drops)});
window.state=()=>({in:document.getElementById('in').value,in2:document.getElementById('in2').value,keys:window.keys,comp:window.comp,drops:window.drops,active:document.activeElement&&document.activeElement.id,focus:document.hasFocus()});
</script>
