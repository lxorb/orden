<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- The same policy the installed app is served with, because a browser and
         the PWA have no server of ours to set the header. One string, written in
         `src/csp.ts` and held to it by `test/csp.test.ts`; that file says what
         each line is for. First in the head, since a policy only governs what is
         parsed after it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-attr 'none'; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: asset: http://asset.localhost; media-src 'self' data: blob: https: asset: http://asset.localhost; font-src 'self' data:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:* ipc: http://ipc.localhost asset: http://asset.localhost blob: data:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) mean anything:
         without it a phone reports zero and the notch covers the header. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Installed from a browser, Nib opens without browser chrome and gets its
         own icon and task-switcher entry. `theme.svelte.ts` keeps the colour
         below in step with the theme in use. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nib" />
    <link rel="icon" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />

    <title>Nib</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
