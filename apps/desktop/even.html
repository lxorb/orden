<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The Even app's WebView, not a browser: no manifest and no install
         prompt, because the phone app is what installs this. Everything else is
         the same page the editor is served as. -->
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon-256.png" />

    <title>Nib</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/even.ts"></script>
  </body>
</html>
