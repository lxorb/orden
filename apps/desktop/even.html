<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The Even app's WebView, not a browser: no manifest and no install
         prompt, because the phone app is what installs this. Everything else is
         the same page the editor is served as. -->
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon-256.png" />

    <title>Nib</title>

    <!-- The one rule the page carries itself, because the stylesheet is a
         module and this has to be readable before any module has loaded. -->
    <style>
      #boot {
        margin: 0;
        padding: 10px 12px;
        color: #8a8f98;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Painted before a line of script runs, and removed by the app the moment
         it mounts. The plain editor has nothing like it, so seeing it at all
         proves the plugin's own page was loaded; seeing it stay proves the page
         loaded and its script did not. -->
    <p id="boot">Nib for G2</p>
    <div id="app"></div>
    <script type="module" src="/src/even.ts"></script>
  </body>
</html>
