windows = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell_Common",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
tauri-runtime-cef = { path = "linux/tauri-runtime-cef" }
