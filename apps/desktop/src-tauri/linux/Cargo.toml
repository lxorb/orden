# GENERATED by scripts/linux-manifest.mjs from ../Cargo.toml. Do not edit by hand:
# change ../Cargo.toml (its [package.metadata.cef] for the pins) and run the script.
#
# Orden on Linux: the app's own package against Tauri 3 and tauri-runtime-cef, with the
# `cef` feature on, so the interface and every web tab run on CEF (Chromium). Built in
# place of ../Cargo.toml, with ./Cargo.lock beside it; see scripts/linux-cef.sh.

[package]
name = "nib"
version = "0.16.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
assert_is_empty = "allow"

[features]
default = ["cef"]
cef = []

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"
tauri-utils = "=3.0.0-alpha.4"
serde_json = "1"

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = ["protocol-asset", "unstable", "custom-protocol"] }
tauri-runtime-cef = { version = "=3.0.0-alpha.6", features = ["unstable"] }
tauri-runtime = "=3.0.0-alpha.4"
cef = { version = "=154.5.0", default-features = false }
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-os = "=3.0.0-alpha.3"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
getrandom = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
png = "0.18"
tauri-runtime-cef = { version = "=3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-process = "=3.0.0-alpha.3"
tempfile = "3"
plist = "1"
tauri-plugin-single-instance = { version = "=3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
sha2 = "0.10"
window-vibrancy = "0.6"
portable-pty = "0.9"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
tokio = { version = "1", default-features = false, features = ["time", "sync"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UIApplication",
  "UIResponder",
  "UIScene",
  "UISceneOptions",
  "UISceneSession",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSCalendar",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProgress",
  "NSSet",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "bitflags",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "block2",
  # A web state's scripts and nib's own page scripts run in a world of their own, and
  # a hidden page is made an origin with an HTML string; see web_state/isolated.rs,
  # restore_view.rs and web_worlds.rs.
  "WKContentWorld",
  "WKNavigation",
  "WKDownload",
  "WKFrameInfo",
  "WKHTTPCookieStore",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPreferences",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataRecord",
  "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
file-id = "0.2"
windows-registry = "0.6"
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  # When this process was created, which is the one thing a launch trace cannot
  # measure from inside it: everything before our first line is the machine loading
  # the binary. See trace.rs.
  "Win32_System_Threading",
  # Whether Ctrl is down as a key is pressed inside a web tab's page, which the
  # engine's own event does not say. See web_keys.rs.
  "Win32_UI_Input_KeyboardAndMouse",
  # Which processes a terminal's shell has started, asked before its tab closes on
  # one of them, and Ctrl+C let through to them. See terminal/process.rs and
  # terminal/session.rs.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  # A job object round Claude Code or Codex and everything it starts, so a stop ends
  # them all; see ai_cli/family.rs. The job's call names a security descriptor.
  "Win32_System_JobObjects",
  "Win32_Security",
  # How much memory the engine's processes hold, before an agent opens another page.
  # See agents/memory.rs.
  "Win32_System_ProcessStatus",
  # A wheel over a page, seen before Windows delivers it and sent to the page's own
  # window, where the engine handles it once (web_wheel.rs); and whether a page asking
  # for the palette has the keyboard, and a key was just pressed, which a double tap is
  # taken on (web_opens.rs).
  "Win32_UI_WindowsAndMessaging",
  # Every window a probe's process makes, on any of its threads, told to it as it is
  # made, so that none is ever on a screen; see foreground.rs.
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  # A second launch hands itself to the first with WM_COPYDATA, waiting at most two
  # seconds for a nib that may have stopped answering; see handover.rs.
  "Win32_System_DataExchange",
  # The shape of a web tab's page, with the app's layers over it cut out of it rather
  # than the page hidden for them; see web_cut.rs.
  "Win32_Graphics_Gdi",
  # How many fingers are on a precision touchpad, from its own reports, so a swipe is
  # decided as they lift and not before; see touchpad.rs.
  "Win32_UI_Input",
  "Win32_Devices_HumanInterfaceDevice",
  # Reminders put on Windows' own schedule of toasts, which rings them with nib not
  # running: the notifier, the toast's XML and the moment it rings. See
  # reminders/toasts.rs.
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "UI_Notifications",
] }
webview2-com = "0.38"
windows-core = "0.61"
windows_com = { package = "windows", version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Gdi",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
