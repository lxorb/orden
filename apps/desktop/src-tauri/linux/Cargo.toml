libloading = "0.8"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
fontdb = "0.24"
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[package]
name = "orden"
version = "0.16.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "orden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["cef"]
cef = []

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"
tauri-utils = "=3.0.0-alpha.4"
serde_json = "1"

[dependencies]
orden-base = { path = "crates/base" }
orden-documents = { path = "crates/documents" }
orden-notes = { path = "crates/notes" }
orden-search = { path = "crates/search" }
orden-secrets = { path = "crates/secrets" }
orden-store = { path = "crates/store" }
orden-web-engine = { path = "crates/web-engine" }
tauri = { version = "=3.0.0-alpha.5", features = ["protocol-asset", "unstable", "custom-protocol"] }
tauri-runtime-cef = { version = "=3.0.0-alpha.6", features = ["unstable"] }
tauri-runtime = "=3.0.0-alpha.4"
cef = { version = "=154.5.0", default-features = false }
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-deep-link.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
flate2.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
percent-encoding.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
orden-agent-web = { path = "crates/agent-web" }
orden-agents = { path = "crates/agents" }
orden-ai = { path = "crates/ai" }
orden-apps = { path = "crates/apps" }
orden-browsers = { path = "crates/browsers" }
orden-crashes = { path = "crates/crashes" }
orden-dictation = { path = "crates/dictation" }
orden-explorer = { path = "crates/explorer" }
orden-extensions = { path = "crates/extensions" }
orden-import = { path = "crates/import" }
orden-placement = { path = "crates/placement" }
orden-pty = { path = "crates/pty" }
orden-reminders = { path = "crates/reminders" }
orden-system = { path = "crates/system" }
orden-web = { path = "crates/web" }
fontdb.workspace = true
png.workspace = true
tauri-runtime-cef = { version = "=3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-process = "=3.0.0-alpha.3"
tempfile.workspace = true
tauri-plugin-single-instance = { version = "=3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-updater.workspace = true
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"
sha2.workspace = true
dirs.workspace = true
reqwest.workspace = true
rustls.workspace = true
ring = "0.17"
tokio.workspace = true
libloading.workspace = true
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
