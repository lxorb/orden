# GENERATED by scripts/linux-manifest.mjs from ../Cargo.toml. Do not edit by hand:
# change ../Cargo.toml (its [package.metadata.cef] for the pins) and run the script.
#
# Orden on the desktops: the app's own package against Tauri 3 and tauri-runtime-cef, with
# the `cef` feature on, so the interface and every web tab run on CEF (Chromium). Built in
# place of ../Cargo.toml, with ./Cargo.lock beside it; see scripts/linux-cef.sh.

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
tauri = "=3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
percent-encoding = "2"
libc = "0.2"
windows = "0.58"
tempfile = "3"
dirs = "6"
getrandom = "0.3"
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
base64 = "0.22"
png = "0.18"
plist = "1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSCalendar",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProcessInfo",
  "NSProgress",
  "NSSet",
  "NSString",
  "NSURL",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSDragging",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPasteboard",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-media",
  "objc2-core-graphics",
  "dispatch2",
  "SCError",
  "SCShareableContent",
  "SCStream",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-video",
  "CMSampleBuffer",
  "CMBase",
  "CMTime",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "CGWindowLevel",
