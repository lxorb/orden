[workspace]

[package]
name = "tauri-runtime-electron"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"
publish = false

[lib]
name = "tauri_runtime_electron"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
tauri-runtime = "=3.0.0-alpha.4"
tauri-utils = "=3.0.0-alpha.4"
raw-window-handle = "0.6"
http = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "=3.0.0-alpha.5", default-features = false, features = ["test", "protocol-asset"] }
tempfile = "3"
percent-encoding = "2"
serde_json = "1"
http = "1"
