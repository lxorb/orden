[package]
name = "orden"
version = "0.16.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

[lib]
name = "orden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
assert_is_empty = "allow"

[features]
cef = []

[package.metadata.cef]
tauri = "3.0.0-alpha.5"
tauri-runtime-cef = "3.0.0-alpha.6"
tauri-runtime = "3.0.0-alpha.4"
tauri-build = "3.0.0-alpha.4"
tauri-utils = "3.0.0-alpha.4"
cef = "154.5.0"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
getrandom = "0.3"
icu_properties = "2"
percent-encoding = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
fontdb = "0.24"
png = "0.18"
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tempfile = "3"
plist = "1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-notification = "~2.4"
sha2 = "0.10"
window-vibrancy = "0.6"
portable-pty = "0.9"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
ring = "0.17"
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
libloading = "0.8"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UIApplication",
  "UIResponder",
  "UIScene",
  "UISceneOptions",
  "UISceneSession",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-local-authentication = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "LAContext",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
wry = { version = "0.55", default-features = false }
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSCalendar",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProcessInfo",
  "NSProgress",
  "NSSet",
  "NSString",
  "NSURL",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSDragging",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPasteboard",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "bitflags",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "objc2-core-foundation",
  "block2",
  "WKContentWorld",
  "WKNavigation",
  "WKDownload",
  "WKDownloadDelegate",
  "WKOpenPanelParameters",
  "WKPDFConfiguration",
  "WKWindowFeatures",
  "WKFrameInfo",
  "WKHTTPCookieStore",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPreferences",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataRecord",
  "WKWebsiteDataStore",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-media",
  "objc2-core-graphics",
  "dispatch2",
  "SCError",
  "SCShareableContent",
  "SCStream",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-video",
  "CMSampleBuffer",
  "CMBase",
  "CMTime",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "CGWindowLevel",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.13", default-features = false, features = ["cursor", "damage", "randr", "resource_manager", "screensaver", "shape", "shm", "xfixes", "xinput", "xtest"] }
libc = "0.2"
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
trash = { version = "5.3", default-features = false, features = ["chrono", "coinit_apartmentthreaded", "freedesktop"] }

[target.'cfg(target_os = "windows")'.dependencies]
file-id = "0.2"
windows-registry = "0.6"
windows = { version = "0.58", features = [
  "Wdk_System_Threading",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_DataExchange",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_StationsAndDesktops",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Security_Credentials_UI",
  "Win32_System_WinRT",
] }
webview2-com = "0.38"
windows-core = "0.61"
windows_com = { package = "windows", version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.55", default-features = false }

[target.'cfg(any(target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api", "p2p"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell_Common",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
wry = { path = "windows/wry" }
tauri-runtime-wry = { path = "windows/tauri-runtime-wry" }
