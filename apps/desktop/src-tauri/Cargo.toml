[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
exclude = ["patches/global-hotkey"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
percent-encoding = "2"
libc = "0.2"
windows = "0.58"
tempfile = "3"
dirs = "6"
getrandom = "0.3"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
base64 = "0.22"
png = "0.18"
plist = "1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSCalendar",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSHTTPCookie",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSProcessInfo",
  "NSProgress",
  "NSSet",
  "NSString",
  "NSURL",
  "NSURLAuthenticationChallenge",
  "NSURLCredential",
  "NSURLProtectionSpace",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "libc",
  "objc2-core-foundation",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSControl",
  "NSDragging",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPasteboard",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
x11rb = { version = "0.13", default-features = false, features = ["cursor", "damage", "randr", "resource_manager", "screensaver", "shape", "shm", "xfixes", "xinput", "xtest"] }
windows-registry = "0.6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "~2.4"
raw-window-handle = "0.6"
trash = { version = "5.3", default-features = false, features = ["chrono", "coinit_apartmentthreaded", "freedesktop"] }

notify = "8.2.2"
file-id = "0.2"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
libloading = "0.8"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
fontdb = "0.24"
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[package]
name = "orden"
version = "0.16.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "orden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
cef = []

[package.metadata.cef]
tauri = "3.0.0-alpha.5"
tauri-runtime-cef = "3.0.0-alpha.6"
tauri-runtime = "3.0.0-alpha.4"
tauri-build = "3.0.0-alpha.4"
tauri-utils = "3.0.0-alpha.4"
cef = "154.5.0"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json = "1"

[dependencies]
orden-base = { path = "crates/base" }
orden-documents = { path = "crates/documents" }
orden-notes = { path = "crates/notes" }
orden-search = { path = "crates/search" }
orden-store = { path = "crates/store" }
orden-web-engine = { path = "crates/web-engine" }
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-deep-link.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
getrandom.workspace = true
percent-encoding.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
orden-secrets = { path = "crates/secrets" }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
orden-agent-web = { path = "crates/agent-web" }
orden-agents = { path = "crates/agents" }
orden-ai = { path = "crates/ai" }
orden-browsers = { path = "crates/browsers" }
orden-carry = { path = "crates/carry" }
orden-crashes = { path = "crates/crashes" }
orden-dictation = { path = "crates/dictation" }
orden-explorer = { path = "crates/explorer" }
orden-extensions = { path = "crates/extensions" }
orden-import = { path = "crates/import" }
orden-mcp-client = { path = "crates/mcp-client" }
orden-placement = { path = "crates/placement" }
orden-pty = { path = "crates/pty" }
orden-reminders = { path = "crates/reminders" }
orden-system = { path = "crates/system" }
orden-web = { path = "crates/web" }
fontdb.workspace = true
png.workspace = true
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-process = "2"
tempfile.workspace = true
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater.workspace = true
tauri-plugin-global-shortcut = "~2.3"
sha2.workspace = true
dirs.workspace = true
reqwest.workspace = true
rustls.workspace = true
ring = "0.17"
tokio.workspace = true
libloading.workspace = true
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
libc.workspace = true
objc2.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
x11rb.workspace = true
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
file-id.workspace = true
windows = { workspace = true, features = [
  "Wdk_System_Threading",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_DataExchange",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_StationsAndDesktops",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Security_Credentials_UI",
  "Win32_System_WinRT",
] }

[dev-dependencies]
orden-base = { path = "crates/base", features = ["testing"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tempfile.workspace = true


[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }
global-hotkey = "0.8"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell_Common",
  "Win32_System_StationsAndDesktops",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
global-hotkey = { path = "patches/global-hotkey" }

