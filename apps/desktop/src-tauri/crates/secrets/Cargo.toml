[package]
name = "orden-secrets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "../base/build.rs"

[lints]
workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
orden-base = { path = "../base" }
tauri.workspace = true
serde_json.workspace = true
base64.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serde.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rustls.workspace = true
ring = "0.17"
sha2.workspace = true
tokio.workspace = true
tauri-plugin-opener.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "LAContext",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }

[dev-dependencies]
tempfile.workspace = true
