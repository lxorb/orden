<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />

    <meta
      name="description"
      content="Orden, the workspace your team shares: notes, canvas, web and files, live together."
    />
    <link rel="icon" href="/icon-256.png" />
    <title>Orden</title>
    <script>
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    </script>
    <script type="module" src="/src/home.ts"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1 class="title">Orden</h1>
        <p class="slogan">Workspace, done differently.</p>
        <div class="actions">
          <a class="orden-button is-brand is-big" data-download href="https://github.com/lxorb/orden/releases/latest"
            ><svg
              class="button-glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 15V3" />
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="m7 10 5 5 5-5" /></svg
            ><span data-label>Download</span></a
          >
          <a class="orden-button is-quiet is-soft is-big" data-app href="https://app.orden.so/"
            ><svg
              class="button-glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" />
              <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></svg
            ><span>Try it out</span></a
          >
        </div>
        <figure class="display is-hero" data-scene="flow" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </header>
      <section class="feature">
        <h2 class="line">Lay it out together.</h2>
        <figure class="display" data-scene="canvas" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Write side by side.</h2>
        <figure class="display" data-scene="markdown" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Draw on anything.</h2>
        <figure class="display" data-scene="pages" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">See everything at once.</h2>
        <figure class="display" data-scene="bubbles" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Let AI do the clicking.</h2>
        <figure class="display" data-scene="ai" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Keep your todos in order.</h2>
        <figure class="display" data-scene="todos" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Talk where you work.</h2>
        <figure class="display" data-scene="chat" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <section class="feature">
        <h2 class="line">Find anything, fast.</h2>
        <figure class="display" data-scene="search" aria-hidden="true">
          <div class="screen"><div class="poster"></div></div>
        </figure>
      </section>
      <footer class="coda">
        <div class="actions coda-actions">
          <a class="orden-button is-brand is-big" data-download href="https://github.com/lxorb/orden/releases/latest"
            ><svg
              class="button-glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 15V3" />
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />

            ><span data-label>Download</span></a
          >

            ><svg

              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" />
              <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></svg
            ><span>Try it out</span></a
          >
        </div>
      </footer>
    </main>

</html>
