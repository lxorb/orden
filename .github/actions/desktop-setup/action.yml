# What every job that builds the desktop app sets up before it builds: pnpm, Node and its
# store, the Rust toolchain for the targets it builds and the crate's cache, Linux's system
# libraries, and the workspace's packages. One place, because release.yml's `build` and
# its two macOS halves (`mac`) build the same app and have to be set up alike.
name: desktop setup
description: pnpm, Node, Rust and the crate's cache, Linux's libraries, and the packages.

inputs:
  target:
    description: The target triple the job builds, which names the crate's cache.
    required: true
  rust-targets:
    description: The rustup targets to install, where that is not `target` itself.
    default: ''
  node-cache:
    description: Whether pnpm's store is cached; see release.yml for the one job without.
    default: 'true'

runs:
  using: composite
  steps:
    # No version here: it comes from the root package.json's packageManager.
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        cache: ${{ inputs.node-cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.node-cache == 'true' }}

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
      with:
        # Named, and not left to the `@stable` the ref used to carry: with the
        # action pinned to a commit, the ref no longer says which toolchain to
        # install, and this is the input that does.
        toolchain: stable
        targets: ${{ inputs.rust-targets || inputs.target }}

    # Linux builds on CEF, from a manifest of its own put in place of the app's, so the
    # crate's cache below is keyed by Linux's own lock file; see scripts/linux-cef.sh.
    - name: Linux's manifest
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/linux-cef.sh

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          apps/desktop/src-tauri
        key: ${{ inputs.target }}
        # Saved from `unstable` only: a cache is read only on the ref that saved it and
        # the ones below it, and the repository's cache has nothing to spare for a tag's
        # or a trial branch's.
        save-if: ${{ github.ref == 'refs/heads/unstable' }}

    # CEF's runtime is GTK 4 (4.14 at least, so Ubuntu 24.04's), and the engine itself is
    # downloaded by its crate's build script; nothing of WebKitGTK or GStreamer. xdg-utils
    # is what the AppImage bundler copies `xdg-open` from; the x64 image happens to ship
    # it, the arm image does not.
    - name: System dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libdbus-1-dev cmake ninja-build patchelf xdg-utils squashfs-tools

    # The engine, laid out where the build and the bundler both read it (CEF_PATH);
    # see scripts/linux-cef.sh.
    - name: The CEF distribution
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/linux-cef.sh cef

    - shell: bash
      run: pnpm install --frozen-lockfile
