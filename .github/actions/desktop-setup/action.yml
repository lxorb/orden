name: desktop setup
description: pnpm, Node, Rust and the crate's cache, Linux's libraries, and the packages.

inputs:
  target:
    description: The target triple the job builds, which names the crate's cache.
    required: true
  rust-targets:
    description: The rustup targets to install, where that is not `target` itself.
    default: ''
  node-cache:
    description: Whether pnpm's store is cached; see release.yml for the one job without.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24
        cache: ${{ inputs.node-cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.node-cache == 'true' }}

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: stable
        targets: ${{ inputs.rust-targets || inputs.target }}

    - name: Linux's manifest
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/linux-cef.sh

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: |
          apps/desktop/src-tauri
        key: ${{ inputs.target }}
        save-if: ${{ github.ref == 'refs/heads/unstable' }}

    - name: System dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libdbus-1-dev libnss3 cmake ninja-build patchelf xdg-utils squashfs-tools

    - name: The CEF distribution
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/linux-cef.sh cef

    - shell: bash
      run: pnpm install --frozen-lockfile
