name: mac-update

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/mac-update-check.sh
      - .github/workflows/mac-update.yml
      - apps/desktop/src/lib/updater.ts
      - apps/desktop/src-tauri/src/updates.rs
      - apps/desktop/src-tauri/src/bundle_name.rs
      - apps/desktop/src-tauri/src/app_place.rs
      - scripts/mac-move-check.sh
      - scripts/mac-window-check.sh
      - apps/desktop/src-tauri/src/placement.rs

concurrency:
  group: mac-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: '0.12.0'
            where: applications
          - from: '0.12.0'
            where: home
          - from: '0.11.0'
            where: applications
          - from: '0.20.0'
            where: applications
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: The release and the one it should become
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ matrix.from }}" --repo "$GITHUB_REPOSITORY" --dir old --pattern '*-macos-universal.dmg'
          latest="$(curl -fsSL https://github.com/lxorb/nibeditor/releases/latest/download/latest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          ls old; echo "the releases offer $latest"
      - name: Updated by itself
        run: bash scripts/mac-update-check.sh "$(ls old/*.dmg | head -1)" ${{ matrix.where }} "$LATEST"

  move:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: mac-move
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          bash scripts/linux-cef.sh tauri build --bundles app --ignore-version-mismatches --config '{"identifier":"so.orden.Orden.probe.mac-move","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
      - name: Stuck on the disk image, moved to Applications
        run: bash scripts/mac-move-check.sh "$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)"

  window:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: mac-window
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          bash scripts/linux-cef.sh tauri build --bundles app --ignore-version-mismatches --config '{"identifier":"so.orden.Orden.probe.mac-window","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}},"app":{"windows":[{"title":"Orden","width":700,"height":450,"minWidth":520,"minHeight":400,"decorations":false,"transparent":true,"dragDropEnabled":false,"visible":false}]}}'
      - name: Under the menu bar, across the middle, and where it was left
        run: bash scripts/mac-window-check.sh "$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-window-shots
          path: mac-window-shots
          if-no-files-found: ignore
