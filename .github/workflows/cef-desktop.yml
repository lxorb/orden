name: cef-desktop

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'check (cargo check under the CEF manifest), test (clippy and the tests too) or launch (an app started on macOS, or installed from the NSIS setup and started on Windows, its logs kept)'
        default: check
      window:
        description: "for launch, the main window's shape: mac (the Mac config) or frameless (decorations off, transparent, as on Linux and Windows)"
        default: mac
      started:
        description: 'for launch, how the app is started: exec (the binary, from the job) or open (LaunchServices, as a person does), and debug or release'
        default: exec debug
  push:
    branches: ['tmp/ci-cef*']

concurrency:
  group: cef-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: The desktop manifest
        run: |
          node scripts/linux-manifest.mjs --check
          bash scripts/linux-cef.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: cef-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: The CEF distribution and ffmpeg, on Windows
        if: runner.os == 'Windows'
        run: |
          bash scripts/linux-cef.sh cef
          choco install ffmpeg -y --no-progress

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Check
        id: check
        continue-on-error: true
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --message-format short 2>&1 | tee check.log

      - name: Clippy and tests
        if: ${{ inputs.step == 'test' && steps.check.outcome == 'success' }}
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: A debug app, started and left for a minute
        if: ${{ inputs.step == 'launch' && runner.os == 'macOS' }}
        timeout-minutes: 30
        env:
          IDENTIFIER: so.orden.Orden.probe.launch
          RUST_BACKTRACE: '1'
          ORDEN_CEF_ARGS: enable-logging=stderr,v=1
        run: |
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          if [ "${{ inputs.window }}" = frameless ]; then
            config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}},"app":{"windows":[{"title":"Orden","width":700,"height":450,"minWidth":520,"minHeight":400,"decorations":false,"transparent":true,"dragDropEnabled":false,"visible":false}]}}'
          fi
          case "${{ inputs.started }}" in
            *release*) profile=release; debug="" ;;
            *) profile=debug; debug="--debug" ;;
          esac
          bash scripts/linux-cef.sh tauri build $debug --target ${{ matrix.target }} --bundles app \
            --ignore-version-mismatches --config "$config"
          app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/$profile/bundle/macos/*.app | head -1)
          find "$app" -maxdepth 3 | sort | head -60
          codesign -dv --entitlements - "$app" 2>&1 | head -30 || true
          exe="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          spaces=$(mktemp -d)
          mkdir -p launch
          case "${{ inputs.started }}" in
            open*)
              open "$app"
              sleep 75
              pid=$(pgrep -f "$app/Contents/MacOS/" | head -1 || true)
              ;;
            *)
              ORDEN_SPACES_DIR="$spaces" "$exe" >launch/stdout.log 2>launch/stderr.log &
              pid=$!
              sleep 75
              ;;
          esac
          support="$HOME/Library/Application Support/$IDENTIFIER"
          export ORDEN_ENDPOINT="$support/automation.json"
          ls -la "$support" 2>/dev/null | head -20 || true
          node apps/cli/orden.mjs verbs 2>&1 | head -5 || true
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            echo "alive after 75s"
            sample "$pid" 5 -file launch/sample.txt || true
            ps -o pid,ppid,stat,command -ax | grep -i -E 'orden|Helper' | grep -v grep > launch/processes.txt || true
            kill "$pid" || true
          else
            echo "not running after 75s"
          fi
          [ -d "$support" ] && { find "$support" -maxdepth 3 | sort > launch/support.txt; cp "$support"/*.log launch/ 2>/dev/null || true; cp "$support"/chromium/cef.log launch/ 2>/dev/null || true; cp -R "$support/crash-reports" launch/ 2>/dev/null || true; }
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i orden | while read -r f; do cp ~/Library/Logs/DiagnosticReports/"$f" launch/; done || true
          tail -60 launch/stderr.log || true
          tail -40 launch/stdout.log || true

      - name: The installers, one installed and its app started and left for a minute
        if: ${{ inputs.step == 'launch' && runner.os == 'Windows' }}
        timeout-minutes: 40
        env:
          IDENTIFIER: so.orden.Orden.probe.launch
          RUST_BACKTRACE: '1'
          ORDEN_CEF_ARGS: enable-logging=stderr,v=1
        run: |
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          case "${{ inputs.started }}" in
            *release*) profile=release; debug="" ;;
            *) profile=debug; debug="--debug" ;;
          esac
          bash scripts/linux-cef.sh tauri build $debug --target ${{ matrix.target }} --bundles nsis,msi \
            --ignore-version-mismatches --config "$config"
          bundle=apps/desktop/src-tauri/target/${{ matrix.target }}/$profile/bundle
          mkdir -p launch
          {
            echo "### installers"
            ls -l "$bundle"/nsis/*.exe "$bundle"/msi/*.msi | awk '{ printf "%s %.1f MB\n", $NF, $5 / 1048576 }'
          } | tee -a launch/installers.txt >>"$GITHUB_STEP_SUMMARY"
          setup=$(ls "$bundle"/nsis/*-setup.exe | head -1)
          home="$RUNNER_TEMP/orden-installed"
          "$setup" /S /D="$(cygpath -w "$home")"
          for _ in $(seq 1 60); do
            [ -f "$home/orden.exe" ] && [ -f "$home/libcef.dll" ] && break
            sleep 5
          done
          ls -l "$home" | head -60
          ls "$home/locales" | head -10
          exe="$home/orden.exe"
          spaces=$(mktemp -d)
          ORDEN_SPACES_DIR="$spaces" "$exe" >launch/stdout.log 2>launch/stderr.log &
          pid=$!
          sleep 75
          support="$(cygpath -u "$APPDATA")/$IDENTIFIER"
          export ORDEN_ENDPOINT="$support/automation.json"
          ls -la "$support" 2>/dev/null | head -20 || true
          node apps/cli/orden.mjs verbs 2>&1 | head -5 || true
          if kill -0 "$pid" 2>/dev/null; then
            echo "alive after 75s"
            tasklist //V | grep -i -E 'orden|bootstrap' > launch/processes.txt || true
            kill "$pid" || true
            sleep 5
            taskkill //IM orden.exe //T //F >/dev/null 2>&1 || true
          else
            echo "not running after 75s"
          fi
          [ -d "$support" ] && { find "$support" -maxdepth 3 | sort > launch/support.txt; cp "$support"/*.log launch/ 2>/dev/null || true; cp "$support"/chromium/cef.log launch/ 2>/dev/null || true; cp -R "$support/crash-reports" launch/ 2>/dev/null || true; }
          cp -R "$(cygpath -u "$LOCALAPPDATA")/CrashDumps" launch/ 2>/dev/null || true
          tail -60 launch/stderr.log || true
          tail -40 launch/stdout.log || true

      - if: ${{ always() && inputs.step == 'launch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-launch-${{ matrix.target }}
          path: launch
          if-no-files-found: ignore

      - name: What the check said
        if: always()
        run: |
          echo "## ${{ matrix.target }}" >>"$GITHUB_STEP_SUMMARY"
          grep -cE '^error' check.log | sed 's/^/errors: /' >>"$GITHUB_STEP_SUMMARY" || true
          grep -E '^error' check.log | sed -E 's/^error(\[E[0-9]+\])?: //' | sort | uniq -c | sort -rn | head -40 >>"$GITHUB_STEP_SUMMARY" || true

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-check-${{ matrix.target }}
          path: check.log
          if-no-files-found: ignore

      - name: The manifest put back
        if: always()
        run: bash scripts/linux-cef.sh back

      - name: The check's verdict
        if: steps.check.outcome != 'success'
        run: exit 1
