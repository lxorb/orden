name: ci-check-startup

# Throwaway. Builds the Windows binary at two refs so the launch of one can be
# timed against the launch of the other on a real x64 machine, because the box this
# was written on is ARM64 and cannot compile the crate at all. Delete with the
# branch.

on:
  push:
    branches: [ci-check-startup]
  workflow_dispatch:

concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The head of this branch: the launch as it is now.
          - name: head
            ref: ''
          # The last tagged release, from 00:13 this morning - the build before
          # everything that landed today.
          - name: v0.7.0
            ref: v0.7.0
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: startup-${{ matrix.name }}

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      # No bundle: an installer would have to be signed, and what is being timed is
      # the binary the installer would have put there.
      - name: Binary
        run: pnpm --filter @nib/desktop exec tauri build --no-bundle

      - name: Name it after the ref
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/nib.exe "out/nib-${{ matrix.name }}.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: nib-${{ matrix.name }}
          path: out/*.exe
          if-no-files-found: error
