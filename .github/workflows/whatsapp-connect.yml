name: whatsapp-connect

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/chats/src/whatsapp/**
      - apps/desktop/src/lib/chats/providers/**
      - apps/desktop/src-tauri/src/wire_socket.rs
      - apps/desktop/node-shims.config.ts
      - scripts/whatsapp-connect-probe.py
      - .github/workflows/whatsapp-connect.yml
  workflow_dispatch:

concurrency:
  group: whatsapp-connect-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drive:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.whatsapp
      ROLLING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc
      - name: The drive build
        run: |
          source scripts/edge-profile.sh
          pnpm --filter @orden/desktop exec vite build --mode drive
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          pnpm --filter @orden/desktop exec tauri build --target x86_64-pc-windows-msvc --no-bundle --config "$config"
      - name: Connect shows a QR code
        run: python scripts/whatsapp-connect-probe.py --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" --identifier "$IDENTIFIER"
      - name: With a number, Connect shows a pairing code
        if: always()
        run: python scripts/whatsapp-connect-probe.py --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" --identifier "$IDENTIFIER" --phone "+41 79 123 45 67"
