name: check

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run, space separated (test lint walks smoke rust-linux rust-windows rust-macos windows-probe android-check mobile-clippy), or all'
        required: true

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unstable:
    if: ${{ github.ref == 'refs/heads/unstable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: Types and generated stylesheets
        run: pnpm check

      - name: Module boundaries
        run: node scripts/modules.mjs --check

      - name: Prettier
        run: pnpm format:check

  plan:
    if: ${{ github.ref != 'refs/heads/unstable' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ASKED: ${{ inputs.jobs }}
          ALL: test lint walks smoke rust-linux rust-windows rust-macos windows-probe android-check mobile-clippy
          APART: '^(services/|packaging/|legal/|LICENSE$|\.github/CODEOWNERS$|\.github/workflows/)|\.md$'
          HERE: '^\.github/workflows/(check|pick)\.yml$'
          NATIVE: '^(apps/desktop/src-tauri/|\.github/workflows/check\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            jobs=$ASKED
            if [ "$jobs" = all ]; then jobs=$ALL; fi
            for job in $jobs; do
              case " $ALL " in *" $job "*) ;; *) echo "::error::check.yml has no job $job; it has: $ALL"; exit 1 ;; esac
            done
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "nothing to compare against; running every job"
            jobs=$ALL
          else
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "$changed"
            jobs="test lint"
            if grep -vE "$APART" <<<"$changed" | grep -q . || grep -qE "$HERE" <<<"$changed"; then
              jobs="$jobs walks smoke rust-linux rust-windows rust-macos windows-probe"
            fi
            if grep -qE "$NATIVE" <<<"$changed"; then jobs="$jobs android-check mobile-clippy"; fi
          fi
          rust=$(for job in $jobs; do
            case "$job" in
              rust-linux) echo ubuntu-24.04 ;;
              rust-windows) echo windows-latest ;;
              rust-macos) echo macos-latest ;;
            esac
          done | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "running: $jobs"
          echo "jobs= $jobs " >>"$GITHUB_OUTPUT"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"

  test:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' test ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-tags: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Tests
        run: pnpm test

  lint:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' lint ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Module boundaries
        run: node scripts/modules.mjs --check

      - name: What each phone app leaves out
        run: node scripts/app-modules.mjs --check

      - name: Contract tests, each module alone
        run: node scripts/modules.mjs --contracts ts

      - name: Prettier
        run: pnpm format:check

      - name: Dead code and unused dependencies
        run: pnpm knip

  walks:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' walks ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: Ten thousand seeds
        run: pnpm --filter @orden/desktop sim:long

  smoke:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' smoke ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: The browser the drive holds
        run: |
          python3 -m pip install --quiet --break-system-packages playwright pillow
          bash scripts/ci-apt.sh --playwright chromium
          python3 -m playwright install chromium

      - name: The drives parse
        run: python3 -m compileall -q apps/desktop/test/e2e

      - name: Smoke
        run: python3 apps/desktop/test/e2e/smoke.py

      - name: A thousand pages open at once
        run: ORDEN_SKIP_BUILD=1 python3 apps/desktop/test/e2e/big-pdf.py

      - name: Nothing is laid out so it cannot be read
        run: ORDEN_SKIP_BUILD=1 python3 apps/desktop/test/e2e/layout-sweep.py

      - name: A release carries no handle
        run: |
          pnpm --filter @orden/desktop build
          if grep -rq "ordenApp" apps/desktop/dist/assets; then
            echo "a release bundle carries window.ordenApp" >&2
            exit 1
          fi
          echo "no handle in the release bundle"

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-shots
          path: |
            apps/desktop/test/e2e/shots/smoke
            apps/desktop/test/e2e/shots/layout-sweep
          if-no-files-found: ignore

  rust:
    needs: plan
    if: ${{ needs.plan.outputs.rust != '[]' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: The desktop manifest
        run: |
          node scripts/linux-manifest.mjs --check
          bash scripts/linux-cef.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: |
            apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: System dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          bash scripts/ci-apt.sh --no-install-recommends libgtk-4-dev libdbus-1-dev cmake ninja-build pandoc
          bash scripts/linux-cef.sh cef

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: The module crates, each alone
        if: runner.os == 'Linux'
        run: |
          for M in apps/desktop/src-tauri/crates/*/Cargo.toml; do
            echo "::group::$M"
            cargo fmt --manifest-path $M --check
            cargo clippy --manifest-path $M --all-targets -- -D warnings
            cargo test --manifest-path $M
            echo "::endgroup::"
          done

      - name: The module crates, each alone, build
        if: runner.os != 'Linux'
        run: |
          failed=
          for M in apps/desktop/src-tauri/crates/*/Cargo.toml; do
            echo "::group::$M"
            cargo check --manifest-path $M --all-targets || failed="$failed $M"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::these crates do not build alone:$failed"; exit 1; }

      - name: Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        timeout-minutes: 25
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/desktop/src-tauri/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-probe:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' windows-probe ') }}
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.protect
      ROLLING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          bash scripts/linux-cef.sh tauri build --target x86_64-pc-windows-msvc --no-bundle \
            --ignore-version-mismatches --config "$config"
          bash scripts/cef-beside.sh apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release

      - name: A note protected, locked and opened with its password
        run: |
          python scripts/protect-drive.py \
            --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" \
            --identifier "$IDENTIFIER" --out protect

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protect
          path: protect
          if-no-files-found: ignore

  android-check:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' android-check ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: The NDK the crate is cross-compiled with
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: apps/desktop/src-tauri
          shared-key: android
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Assemble the release APK, R8 and all
        run: |
          pnpm --filter @orden/desktop exec tauri android build --apk \
            --target aarch64 --target x86_64

      - name: Say what came out
        run: |
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print

      - name: The Kotlin's unit tests
        working-directory: apps/desktop/src-tauri/gen/android
        run: |
          ./gradlew :app:testUniversalReleaseUnitTest --console=plain
          grep -h -o '<testsuite name="[^"]*" tests="[0-9]*"' app/build/test-results/testUniversalReleaseUnitTest/*.xml
          for suite in AlarmListTest ChatPushesTest TrackTimerTest TextSizeTest; do
            ls "app/build/test-results/testUniversalReleaseUnitTest/TEST-so.orden.Orden.$suite.xml"
          done

      - name: Each app's manifest carries its own tiles, widgets and permissions, and no other app's
        working-directory: apps/desktop/src-tauri/gen/android
        run: |
          wrong=0
          for app in orden notes track todo chat; do
            ./gradlew :app:processUniversalReleaseManifest "-PordenApp=$app" --console=plain -q
            merged=$(find app/build/intermediates/merged_manifests/universalRelease -name AndroidManifest.xml | head -1)
            (cd ../../../../.. && node scripts/phone-manifest.mjs "$app" "apps/desktop/src-tauri/gen/android/$merged") || wrong=1
          done
          exit "$wrong"

      - name: Orden Chat's push compiles, with no Firebase project
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew :app:compileUniversalReleaseKotlin -PordenApp=chat --console=plain

      - name: What R8 could not resolve
        if: always()
        run: |
          mapping=apps/desktop/src-tauri/gen/android/app/build/outputs/mapping
          if [ -d "$mapping" ]; then
            find "$mapping" -name 'missing_rules.txt' -print -exec cat {} ';'
          else
            echo "R8 wrote no mapping folder"
          fi

  mobile-clippy:
    needs: plan
    if: ${{ contains(needs.plan.outputs.jobs, ' mobile-clippy ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: apps/desktop/src-tauri
          shared-key: clippy-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Clippy, as the phone builds it
        run: |
          if [ "$TARGET" = aarch64-linux-android ]; then
            ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_aarch64_linux_android="$ndk/aarch64-linux-android24-clang"
            export AR_aarch64_linux_android="$ndk/llvm-ar"
          fi
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target "$TARGET" -- -D warnings

  deploy:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/heads/tmp/') }}

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: |
          git fetch -q --tags --depth=1 origin
          latest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          ORDEN_RELEASE=true ORDEN_VERSION="${latest#v}" pnpm --filter @orden/desktop build --mode web

      - name: Build the unstable web app
        id: unstable
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin unstable
          git worktree add --detach "$RUNNER_TEMP/unstable" FETCH_HEAD
          cd "$RUNNER_TEMP/unstable"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<<"${latest:-0.0.0}"
          export ORDEN_RELEASE=unstable ORDEN_VERSION="$major.$minor.$((patch + 1))-$GITHUB_RUN_NUMBER"
          VITE_ORDEN_CHANNEL=unstable pnpm --filter ./apps/desktop build --mode web

      - name: Put the two builds together
        id: together
        if: steps.unstable.outcome == 'success'
        continue-on-error: true
        run: bash scripts/web-channels.sh apps/desktop/dist "$RUNNER_TEMP/unstable/apps/desktop/dist"

      - name: Migrate the database
        run: pnpm --filter @orden/sync run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build ordend for the machine image
        run: pnpm --filter @orden/machine build

      - name: Deploy the Worker
        run: |
          pnpm --filter @orden/sync run deploy \
            --tag "main-${GITHUB_SHA::12}" \
            --message "main $GITHUB_SHA unstable ${UNSTABLE_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSTABLE_SHA: ${{ steps.together.outcome == 'success' && steps.unstable.outputs.sha || 'none' }}
