name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Tests
        run: pnpm test

  lint:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Dead code and unused dependencies
        run: pnpm knip

      - name: The README opens with the rename
        run: |
          expected='> Important: NibEditor is now Orden. We decided to change the name but everything else is still the same :)'
          if [ "$(head -n 1 README.md)" != "$expected" ]; then
            echo "README.md must open with: $expected" >&2
            exit 1
          fi

  walks:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ten thousand seeds
        run: pnpm --filter @orden/desktop sim:long

  smoke:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The browser the drive holds
        run: |
          python3 -m pip install --quiet --break-system-packages playwright pillow
          bash scripts/ci-apt.sh --playwright chromium
          python3 -m playwright install chromium

      - name: The drives parse
        run: python3 -m compileall -q apps/desktop/test/e2e

      - name: Smoke
        run: python3 apps/desktop/test/e2e/smoke.py

      - name: The launch hands the thread back
        run: NIB_SKIP_BUILD=1 python3 apps/desktop/test/e2e/long-tasks.py

      - name: A thousand pages open at once
        run: NIB_SKIP_BUILD=1 python3 apps/desktop/test/e2e/big-pdf.py

      - name: Nothing is laid out so it cannot be read
        run: NIB_SKIP_BUILD=1 python3 apps/desktop/test/e2e/layout-sweep.py

      - name: A release carries no handle
        run: |
          pnpm --filter @orden/desktop build
          if grep -rq nibApp apps/desktop/dist/assets; then
            echo "a release bundle carries window.nibApp" >&2
            exit 1
          fi
          echo "no handle in the release bundle"

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-shots
          path: |
            apps/desktop/test/e2e/shots/smoke
            apps/desktop/test/e2e/shots/layout-sweep
          if-no-files-found: ignore

  webkit:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The browser the drives hold
        run: |
          python3 -m pip install --quiet --break-system-packages playwright pillow
          bash scripts/ci-apt.sh --playwright webkit
          python3 -m playwright install webkit

      - name: The core drives, as a Mac
        env:
          NIB_ENGINE: webkit
        run: python3 apps/desktop/test/e2e/run-all.py --jobs 2 --retries 1 --only smoke,keyboard,new-tabs,find-bar,hover-preview,frames,handed,callouts,highlights-links-breaks,task-rows

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-shots
          path: apps/desktop/test/e2e/shots
          if-no-files-found: ignore

  webkit-mac:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The browser the drives hold
        run: |
          python3 -m pip install --quiet --break-system-packages playwright pillow
          python3 -m playwright install webkit

      - name: The floor, on a Mac
        env:
          NIB_ENGINE: webkit
        run: python3 apps/desktop/test/e2e/run-all.py --jobs 2 --retries 1 --only smoke,keyboard,find-bar,hover-preview

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webkit-mac-shots
          path: apps/desktop/test/e2e/shots
          if-no-files-found: ignore

  rust:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Linux's manifest
        if: runner.os == 'Linux'
        run: |
          node scripts/linux-manifest.mjs --check
          bash scripts/linux-cef.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: System dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          bash scripts/ci-apt.sh --no-install-recommends libgtk-4-dev libdbus-1-dev cmake ninja-build pandoc xvfb ffmpeg pulseaudio pulseaudio-utils
          bash scripts/linux-cef.sh cef

      - name: ffmpeg, on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        timeout-minutes: 25
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/desktop/src-tauri/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: The window's thread, alone
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test window_thread -- --ignored

      - name: Latency, alone
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/desktop/src-tauri/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --ignored --exact apps_host::stream::tests::latency_benchmark

  apps-windows:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: ch.emilvinu.nib.probe.apps
      ROLLING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc

      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          pnpm --filter @orden/desktop exec tauri build --target x86_64-pc-windows-msvc --no-bundle --config "$config"

      - name: Notepad, hosted and shown
        run: |
          python scripts/apps-drive.py \
            --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/nib.exe" \
            --identifier "$IDENTIFIER" --shot apps-windows.png

      - name: A note protected, locked and opened with its password
        if: always()
        run: |
          python scripts/protect-drive.py \
            --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/nib.exe" \
            --identifier "$IDENTIFIER" --out protect

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apps-windows
          path: |
            apps-windows.png
            protect
          if-no-files-found: ignore

  mobile-touched:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      touched: ${{ steps.look.outputs.touched }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: look
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "nothing to compare against; building anyway"
            echo "touched=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$changed"

          if echo "$changed" | grep -qE '^(apps/desktop/src-tauri/|\.github/workflows/check\.yml$)'; then
            echo "touched=true" >>"$GITHUB_OUTPUT"
          else
            echo "touched=false" >>"$GITHUB_OUTPUT"
          fi

  android-check:
    needs: mobile-touched
    if: needs.mobile-touched.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: The NDK the crate is cross-compiled with
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: android
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Assemble the release APK, R8 and all
        run: |
          pnpm --filter @orden/desktop exec tauri android build --apk \
            --target aarch64 --target x86_64

      - name: Say what came out
        run: |
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print

      - name: The Kotlin's unit tests
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew :app:testUniversalReleaseUnitTest --console=plain

      - name: What R8 could not resolve
        if: always()
        run: |
          mapping=apps/desktop/src-tauri/gen/android/app/build/outputs/mapping
          if [ -d "$mapping" ]; then
            find "$mapping" -name 'missing_rules.txt' -print -exec cat {} ';'
          else
            echo "R8 wrote no mapping folder"
          fi

  mobile-clippy:
    needs: mobile-touched
    if: needs.mobile-touched.outputs.touched == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: clippy-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Clippy, as the phone builds it
        run: |
          if [ "$TARGET" = aarch64-linux-android ]; then
            ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_aarch64_linux_android="$ndk/aarch64-linux-android24-clang"
            export AR_aarch64_linux_android="$ndk/llvm-ar"
          fi
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target "$TARGET" -- -D warnings

  deploy:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @orden/desktop build

      - name: Build the unstable web app
        id: unstable
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin unstable
          git worktree add --detach "$RUNNER_TEMP/unstable" FETCH_HEAD
          cd "$RUNNER_TEMP/unstable"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
          VITE_ORDEN_CHANNEL=unstable pnpm --filter ./apps/desktop build

      - name: Put the two builds together
        id: together
        if: steps.unstable.outcome == 'success'
        continue-on-error: true
        run: bash scripts/web-channels.sh apps/desktop/dist "$RUNNER_TEMP/unstable/apps/desktop/dist"

      - name: Migrate the database
        run: pnpm --filter @orden/sync run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build nibd for the machine image
        run: pnpm --filter @orden/machine build

      - name: Deploy the Worker
        run: |
          pnpm --filter @orden/sync run deploy \
            --tag "main-${GITHUB_SHA::12}" \
            --message "main $GITHUB_SHA unstable ${UNSTABLE_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSTABLE_SHA: ${{ steps.together.outcome == 'success' && steps.unstable.outputs.sha || 'none' }}
