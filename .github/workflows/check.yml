name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  # Superseding a branch run saves wasted minutes. Superseding a main run can
  # cancel it between the migration and the Worker deploy, leaving the database
  # ahead of the code that reads it - so main queues instead of cancelling.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Dead code and unused dependencies
        run: pnpm knip

      - name: Tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri

      # Tauri needs the system webview to compile against.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # Tauri's build script embeds the built frontend, so it has to exist
      # before the crate will even compile.
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  # Whatever is on main is what nibeditor.com serves. Gated on the tests above,
  # so a red build never reaches anyone.
  deploy:
    # Only the types and tests. Clippy guards the desktop app, which is not
    # what this deploys, and coupling the two would let a lint stop a fix.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Deploys queue rather than race. Cancelling one halfway is how a database
    # ends up migrated for a Worker that never arrived.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Worker serves the built app from its assets binding, so the build
      # has to exist before the deploy reads it.
      - name: Build the web app
        run: pnpm --filter @nib/desktop build

      # Schema first. A new Worker may read a column the old schema lacks, and
      # the reverse - an unused new column - breaks nothing.
      #
      # `run` is spelled out in both steps below because `pnpm deploy` is a
      # pnpm command of its own, and swallows the package script otherwise.
      - name: Migrate the database
        run: pnpm --filter @nib/sync run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the Worker
        run: pnpm --filter @nib/sync run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
