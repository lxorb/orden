name: web-tab

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src/lib/drops.ts
      - apps/desktop/src/lib/drag-paths.ts
      - apps/desktop/src/lib/outside-drops.ts
      - scripts/web-tab-drive.py
      - scripts/gesture-drive.py
      - scripts/outside-drop-drive.py
      - scripts/pinch-drive.py
      - .github/workflows/web-tab.yml
  workflow_dispatch:

concurrency:
  group: web-tab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  answers:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.web-tab
      ROLLING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          case "$RUNNER_OS" in
            Linux)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --no-bundle \
                --ignore-version-mismatches --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/orden" >>"$GITHUB_ENV"
              ;;
            macOS)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --bundles app \
                --ignore-version-mismatches --config "$config"
              app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
              echo "EXE=$PWD/$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" >>"$GITHUB_ENV"
              ;;
            Windows)
              pnpm --filter @orden/desktop exec tauri build --target ${{ matrix.target }} --no-bundle --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/orden.exe" >>"$GITHUB_ENV"
              ;;
          esac

      - name: A screen, on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11
          sandbox="$(dirname "$EXE")/chrome-sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

      - name: A web tab, and the app still answers
        run: |
          drive=(scripts/web-tab-drive.py --exe "$EXE" --identifier "$IDENTIFIER")
          case "$RUNNER_OS" in
            Linux) xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 "${drive[@]}" ;;
            Windows) python "${drive[@]}" ;;
            *) python3 "${drive[@]}" ;;
          esac

      - name: Orden's own scripts are not the reader's press
        if: ${{ !cancelled() && env.EXE != '' }}
        timeout-minutes: 15
        run: |
          drive=(scripts/gesture-drive.py --exe "$EXE" --identifier "$IDENTIFIER")
          case "$RUNNER_OS" in
            Linux)
              python3 -m pip install --quiet --break-system-packages python-xlib
              xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 "${drive[@]}"
              ;;
            Windows) python "${drive[@]}" ;;
            *)
              python3 -m venv "$RUNNER_TEMP/gestures"
              "$RUNNER_TEMP/gestures/bin/pip" install --quiet pyobjc-framework-Quartz
              "$RUNNER_TEMP/gestures/bin/python" "${drive[@]}"
              ;;
          esac

      - name: A pinch magnifies the page and leaves its zoom
        if: ${{ !cancelled() && env.EXE != '' }}
        timeout-minutes: 15
        run: |
          drive=(scripts/pinch-drive.py --exe "$EXE" --identifier "$IDENTIFIER")
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput
              python3 -m pip install --quiet --break-system-packages evdev python-xlib
              sudo modprobe uinput || true
              sudo chmod 666 /dev/uinput
              conf="$RUNNER_TEMP/pinch-xorg.conf"
              printf '%s\n' \
                'Section "ServerFlags"' '  Option "AutoAddDevices" "true"' '  Option "AllowEmptyInput" "true"' 'EndSection' \
                'Section "Device"' '  Identifier "dummy"' '  Driver "dummy"' '  VideoRam 256000' 'EndSection' \
                'Section "Screen"' '  Identifier "screen"' '  Device "dummy"' '  DefaultDepth 24' \
                '  SubSection "Display"' '    Depth 24' '    Virtual 1600 1000' '  EndSubSection' 'EndSection' \
                'Section "InputClass"' '  Identifier "pads"' '  MatchIsTouchpad "on"' '  Driver "libinput"' 'EndSection' >"$conf"
              sudo Xorg :7 -noreset -config "$conf" -logfile "$RUNNER_TEMP/xorg.log" &
              xorg=$!
              sleep 4
              said=0
              DISPLAY=:7 dbus-run-session -- python3 "${drive[@]}" || said=$?
              sudo kill "$xorg" || true
              if [ "$said" != 0 ]; then
                sudo grep -i -E "touchpad|libinput|gesture|error" "$RUNNER_TEMP/xorg.log" | tail -40
                exit "$said"
              fi
              ;;
            Windows) python "${drive[@]}" ;;
            *) python3 "${drive[@]}" ;;
          esac

      - name: Files dropped from outside
        if: ${{ !cancelled() && env.EXE != '' }}
        timeout-minutes: 15
        run: |
          drive=(scripts/outside-drop-drive.py --exe "$EXE" --identifier "$IDENTIFIER")
          case "$RUNNER_OS" in
            Linux)
              python3 -m pip install --quiet --break-system-packages python-xlib
              xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 "${drive[@]}"
              ;;
            Windows)
              python -m pip install --quiet comtypes
              python "${drive[@]}"
              ;;
            *)
              python3 -m venv "$RUNNER_TEMP/drop"
              "$RUNNER_TEMP/drop/bin/pip" install --quiet pyobjc-framework-Quartz pyobjc-framework-Cocoa
              "$RUNNER_TEMP/drop/bin/python" "${drive[@]}"
              ;;
          esac
