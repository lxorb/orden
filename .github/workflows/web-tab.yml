name: web-tab

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/desktop/src-tauri/src/**
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src/lib/drops.ts
      - apps/desktop/src/lib/drag-paths.ts
      - apps/desktop/src/lib/outside-drops.ts
      - scripts/web-tab-drive.py
      - scripts/outside-drop-drive.py
      - scripts/pinch-drive.py
      - .github/workflows/web-tab.yml
  workflow_dispatch:

concurrency:
  group: web-tab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  answers:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        run: ['fuzz 11', 'fuzz 12', 'fuzz 13', 'storm']
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.web-tab
      ROLLING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          case "$RUNNER_OS" in
            Linux)
              bash scripts/linux-cef.sh tauri build --target x86_64-pc-windows-msvc --no-bundle \
                --ignore-version-mismatches --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden" >>"$GITHUB_ENV"
              ;;
            macOS)
              pnpm --filter @orden/desktop exec tauri build --target x86_64-pc-windows-msvc --bundles app --config "$config"
              app=$(ls -d apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/macos/*.app | head -1)
              echo "EXE=$PWD/$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" >>"$GITHUB_ENV"
              ;;
            Windows)
              pnpm --filter @orden/desktop exec tauri build --target x86_64-pc-windows-msvc --no-bundle --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" >>"$GITHUB_ENV"
              ;;
          esac

      - name: procdump
        run: |
          curl -sSL -o "$RUNNER_TEMP/procdump.zip" https://download.sysinternals.com/files/Procdump.zip
          mkdir -p "$RUNNER_TEMP/procdump" && cd "$RUNNER_TEMP/procdump" && unzip -q ../procdump.zip

      - name: Pillow
        run: python -m pip install --quiet pillow

      - name: Hunt
        timeout-minutes: 50
        run: |
          set -- ${{ matrix.run }}
          args="--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection,HideCursorWhileTyping,TouchpadOverscrollHistoryNavigation --overscroll-history-navigation=0 --renderer-process-limit=1"
          case "${{ matrix.run }}" in
            dialogs*) python scripts/dialog-probe.py --exe "$EXE" --identifier "$IDENTIFIER" ;;
            "stray off visual") python scripts/stray-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --off ;;
            "stray on visual") python scripts/stray-probe.py --exe "$EXE" --identifier "$IDENTIFIER" ;;
            "stray off windowed") python scripts/stray-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --off --windowed ;;
            "stray on windowed") python scripts/stray-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --windowed ;;
            storm) python scripts/storm-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --seconds 15 ;;
            fuzz*) python scripts/freeze-fuzz.py --exe "$EXE" --identifier "$IDENTIFIER" --minutes 25 --seed $2 ;;
            "busy default") python scripts/busy-tab-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --first busy ;;
            "busy one") python scripts/busy-tab-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --first busy --args "$args" ;;
            "dialogs one") python scripts/busy-tab-probe.py --exe "$EXE" --identifier "$IDENTIFIER" --first alert,confirm,leave --args "$args" ;;
          esac
