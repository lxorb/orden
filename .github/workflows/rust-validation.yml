name: rust-validation

# Temporary: the desktop crate cannot be compiled on the machine this branch is
# written on, so format, lint and tests are run here. Deleted with the branch.

on:
  workflow_dispatch:
  push:
    branches: ['rust-crate-validation']

concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: Format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Cargo resolves the lock file itself; this is how the resolved one gets
      # back to the branch it belongs on.
      - name: Lock file
        if: ${{ !cancelled() }}
        run: git diff --patch -- apps/desktop/src-tauri/Cargo.lock

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nib/desktop build

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
