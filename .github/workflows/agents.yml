name: agents

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/probe_app.py
      - apps/desktop/test/agents/**
      - .github/workflows/agents.yml
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  watch:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: The drives parse
        run: python3 -m compileall -q scripts/probe_app.py apps/desktop/test/agents

      - name: The watch
        run: python3 -m unittest discover -s apps/desktop/test/agents -p "*_test.py" -v

  scenarios:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.nightly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: The probe
        run: |
          printf '{"identifier":"%s","version":"99.0.0","plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}' \
            "$IDENTIFIER" > probe.json
          pnpm --filter @orden/desktop exec tauri build --no-bundle --config ../../probe.json

      - name: Through the endpoint
        run: |
          python apps/desktop/test/agents/run.py --exe apps/desktop/src-tauri/target/release/orden.exe \
            --identifier "$IDENTIFIER" --via endpoint --out endpoint.json

      - name: Through orden mcp
        if: always()
        run: |
          python apps/desktop/test/agents/run.py --exe apps/desktop/src-tauri/target/release/orden.exe \
            --identifier "$IDENTIFIER" --via mcp --out mcp.json

      - name: What an agent set up costs the launch
        if: always()
        run: |
          python apps/desktop/test/agents/run.py --exe apps/desktop/src-tauri/target/release/orden.exe \
            --identifier "$IDENTIFIER" --launch-cost 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-scenarios
          path: |
            endpoint.json
            mcp.json
          if-no-files-found: ignore
