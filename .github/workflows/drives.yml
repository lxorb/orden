name: drives

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only the drives whose name holds one of these words, comma separated'
        required: false
        default: ''

concurrency:
  group: drives
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  which:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ref: ${{ steps.which.outputs.ref }}
      go: ${{ steps.which.outputs.go }}
    steps:
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "Dispatched: driving $GITHUB_REF_NAME at $GITHUB_SHA."
            { echo "ref=$GITHUB_SHA"; echo go=true; } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "repos/$REPO/commits/unstable" --jq .sha)
          pushed=$(gh api "repos/$REPO/activity?ref=refs/heads/unstable&per_page=1" --jq '.[0].timestamp // ""') || pushed=""
          last=$(gh api "repos/$REPO/actions/workflows/drives.yml/runs?event=schedule&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != $RUN)][0].created_at // \"\"") || last=""
          echo "unstable is $sha, last pushed ${pushed:-at no time GitHub says}; the last night started ${last:-never}."
          if [ -z "$pushed" ] || [ -z "$last" ] || [[ "$pushed" > "$last" ]]; then
            go=true
          else
            go=false
            echo "::notice::Nothing pushed to unstable since the last night; no drives tonight."
          fi
          { echo "ref=$sha"; echo "go=$go"; } >>"$GITHUB_OUTPUT"

  drives:
    needs: which
    if: ${{ needs.which.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.which.outputs.ref }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The browsers the drives hold
        run: |
          python3 -m pip install --quiet --break-system-packages playwright pillow
          python3 -m playwright install --with-deps chromium webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Drives
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 apps/desktop/test/e2e/run-all.py --jobs 2 --retries 1 ${ONLY:+--only "$ONLY"}

      - name: The table
        if: always()
        run: |
          table=apps/desktop/test/e2e/shots/results.md
          if [ -f "$table" ]; then cat "$table" >>"$GITHUB_STEP_SUMMARY"; fi

      - name: The shots and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: drives
          path: apps/desktop/test/e2e/shots
          retention-days: 14
          if-no-files-found: ignore
