name: nix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packaging/nix/**
      - flake.nix
      - flake.lock
      - scripts/bump-packaging.mjs
      - .github/workflows/nix.yml
      - .github/workflows/packaging-bump.yml
      - scripts/nix-start.sh
  workflow_dispatch:
    inputs:
      flake:
        description: The flake to start, as `nix run` takes it; empty uses the checked-out branch
        default: ''
      package:
        description: The package to build and start, `default` when empty
        default: ''
      resolve_source_hashes:
        description: Resolve fake Cargo and pnpm hashes during source-flake validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      flake:
        description: The flake to start; the checkout's packaging/nix when empty
        type: string
        default: ''
      package:
        description: The package to build and start, `default` when empty
        type: string
        default: ''
      artifact:
        description: An artifact of the calling run laid over packaging/ first
        type: string
        default: ''
      resolve_source_hashes:
        description: Resolve fake Cargo and pnpm hashes during source-flake validation
        type: boolean
        default: false

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}-${{ inputs.flake }}-${{ inputs.package }}-${{ inputs.artifact }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  start:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            other: aarch64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            other: x86_64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: The root flake.lock is packaging/nix/flake.lock
        run: |
          if [ ! -e flake.nix ]; then
            echo "no root flake on this branch"
            exit 0
          fi
          if ! cmp flake.lock packaging/nix/flake.lock; then
            echo "::error::flake.lock and packaging/nix/flake.lock differ: they lock one flake, so copy packaging/nix/flake.lock over the root's"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: packaging

      - name: The root flake.lock, the one laid over packaging/nix
        if: inputs.artifact != ''
        run: if [ -e flake.nix ]; then cp packaging/nix/flake.lock flake.lock; fi

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Which flake
        id: flake
        env:
          ASKED: ${{ inputs.flake }}
          SHA: ${{ github.sha }}
          PACKAGE: ${{ inputs.package }}
          RESOLVE_HASHES: ${{ inputs.resolve_source_hashes }}
        run: |
          if [ "$RESOLVE_HASHES" = true ]; then
            attr=orden-source
          else
            attr=${PACKAGE:-default}
          fi
          echo "attr=$attr" >>"$GITHUB_OUTPUT"
          if [ "$attr" = orden-source ]; then start=default; else start=$attr; fi
          echo "start=$start" >>"$GITHUB_OUTPUT"
          if [ -n "$ASKED" ]; then
            flake="$ASKED"
          elif [ -f "$PWD/flake.nix" ]; then
            flake="path:$PWD"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            flake="github:$GITHUB_REPOSITORY/$SHA?dir=packaging/nix"
          else
            flake="path:$PWD/packaging/nix"
          fi
          echo "flake=$flake" >>"$GITHUB_OUTPUT"
          echo "### $flake#$attr" >>"$GITHUB_STEP_SUMMARY"

      - name: nix flake check
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: nix flake check --all-systems --print-build-logs "$FLAKE"

      - name: flake.lock is committed and current
        if: startsWith(steps.flake.outputs.flake, 'path:')
        run: |
          git status --porcelain flake.lock packaging/nix
          if [ -n "$(git status --porcelain flake.lock packaging/nix/flake.lock)" ] && [ -z "${{ inputs.artifact }}" ]; then
            echo "::error::flake.lock or packaging/nix/flake.lock is missing or stale"
            exit 1
          fi

      - name: The ${{ matrix.other }} package evaluates
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: nix eval --raw "$FLAKE#packages.${{ matrix.other }}.${{ steps.flake.outputs.attr }}.name"

      - name: nix build
        id: build
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
          ATTR: ${{ steps.flake.outputs.attr }}
        run: |
          pname=$(nix eval --raw "$FLAKE#$ATTR.pname")
          if [ "$pname" = orden-source ]; then
            engine=cef
          else
            engine=$(nix eval --raw "$FLAKE#$ATTR.engine")
          fi
          echo "engine=$engine" >>"$GITHUB_OUTPUT"
          echo "### $pname $(nix eval --raw "$FLAKE#$ATTR.version")" >>"$GITHUB_STEP_SUMMARY"

          if [ "$pname" = orden-source ]; then
            for attempt in 1 2 3; do
              set +e
              nix build --print-build-logs "$FLAKE#$ATTR" -o result 2>&1 | tee nix-build.log
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" -eq 0 ] && break

              hash=$(sed -n 's/.*got: *\(sha256-[^[:space:]]*\).*/\1/p' nix-build.log | tail -1)
              derivation=$(sed -n "s/.*fixed-output derivation '\([^']*\)'.*/\1/p" nix-build.log | head -1)
              if [ -z "$hash" ] || [ -z "$derivation" ]; then
                cat nix-build.log
                exit "$status"
              fi

              case "$derivation" in
                *pnpm*) kind=pnpm ;;
                *vendor*|*cargo*)
                  echo "::error::the cargo dependencies have no hash to resolve: $derivation"
                  cat nix-build.log; exit "$status" ;;
                *) echo "::error::unknown fixed-output input: $derivation"; cat nix-build.log; exit "$status" ;;
              esac
              python - "$hash" <<'PY'
          import re, sys
          from pathlib import Path

          digest, = sys.argv[1:]
          flake = Path('packaging/nix/flake.nix')
          source = flake.read_text()
          # Whatever stands there: the pinned hash, or a placeholder if one ever does.
          source, count = re.subn(
              r'(pnpmDeps = pkgs\.fetchPnpmDeps \{.*?hash = )(?:"[^"]*"|lib\.fakeHash);',
              rf'\1"{digest}";',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('could not fill the pnpm hash')
          flake.write_text(source)
          print(f'Pinned pnpm dependencies to {digest}')
          PY
              echo "Retrying the source build after pinning its $kind hash (attempt $attempt)."
            done
            test -x "result/bin/$pname"
          else
            nix build --print-build-logs "$FLAKE#$ATTR" -o result
          fi

          test -x "result/bin/$pname"
          find result/bin result/share -type f -o -type l | sort | tee files.txt
          case "$pname" in
            orden)
              test "$(readlink result/bin/nib)" = orden
              expected=2
              ;;
            orden-unstable | orden-source) expected=1 ;;
            *) echo "::error::unexpected Nix package name: $pname"; exit 1 ;;
          esac
          test "$(find result/bin -mindepth 1 | wc -l)" -eq "$expected"
          cat "result/bin/$pname"
          if grep -n GDK_BACKEND "result/bin/$pname"; then exit 1; fi
          if [ "$engine" = webkit ]; then
            grep -q '/proc/driver/nvidia/version ]; then export WEBKIT_DISABLE_DMABUF_RENDERER=1' "result/bin/$pname"
          fi
          if [ "$engine" = cef ] && [ "$pname" != orden-source ]; then
            check=$(grep -o "/nix/store/[^' ]*-userns.sh" "result/bin/$pname")
            test -f "$check"
            if grep -q no-sandbox "result/bin/$pname"; then exit 1; fi
            if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
              bash -ec ". $check" 2>&1 | tee userns.log | grep -q 'No usable sandbox'
            fi
          fi
          nix shell nixpkgs#pax-utils -c lddtree "result/libexec/$pname/nib" | head -80
          nix shell nixpkgs#desktop-file-utils -c desktop-file-validate "result/share/applications/$pname.desktop"
          cat "result/share/applications/$pname.desktop"
          for size in 32x32 128x128 256x256; do
            test -s "result/share/icons/hicolor/$size/apps/$pname.png"
          done

      - name: A graphics driver where NixOS keeps it
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: |
          mesa=$(nix build --no-link --print-out-paths --no-write-lock-file --inputs-from "$FLAKE" nixpkgs#mesa | head -1)
          sudo ln -sfn "$mesa" /run/opengl-driver
          ls -la /run/opengl-driver/ /run/opengl-driver/share/glvnd/egl_vendor.d

      - name: sway, Xwayland and the tools that look at them
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway xwayland grim jq

      - name: A plugin path full of strangers, and GStreamer's own inspector
        if: steps.build.outputs.engine == 'webkit'
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
        run: |
          gst=$(nix build --no-link --print-out-paths --no-write-lock-file --inputs-from "$FLAKE" nixpkgs#gst_all_1.gstreamer.bin)
          stranger=$HOME/profile/lib/qt-6/plugins/kf6
          mkdir -p "$stranger"
          find /usr/lib -name 'lib*.so.*' -type f | head -40 | xargs -I{} cp {} "$stranger"/
          for name in kio_trash dolphinpart kcm_fcitx5; do
            head -c 65536 /dev/urandom >"$stranger/$name.so"
          done
          GST_REGISTRY_1_0=$(mktemp -u) GST_PLUGIN_PATH="$HOME/profile/lib" "$gst/bin/gst-inspect-1.0" playbin >stranger.log 2>&1 || true
          grep -c 'Failed to load plugin' stranger.log
          echo "GST_INSPECT=$gst/bin/gst-inspect-1.0" >>"$GITHUB_ENV"
          echo "STRANGER_PLUGINS=$HOME/profile/lib" >>"$GITHUB_ENV"

      - name: User namespaces, as NixOS has them
        if: steps.build.outputs.engine == 'cef'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: It starts on Wayland
        id: wayland
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
          ENGINE: ${{ steps.build.outputs.engine }}
        run: bash scripts/nix-start.sh wayland "$FLAKE#${{ steps.flake.outputs.start }}" "$ENGINE"

      - name: It starts on X11, through Xwayland
        if: ${{ !cancelled() && steps.wayland.outcome != 'skipped' }}
        env:
          FLAKE: ${{ steps.flake.outputs.flake }}
          ENGINE: ${{ steps.build.outputs.engine }}
        run: bash scripts/nix-start.sh x11 "$FLAKE#${{ steps.flake.outputs.start }}" "$ENGINE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nix-${{ matrix.system }}${{ inputs.artifact != '' && '-bumped' || '' }}${{ inputs.flake != '' && '-github' || '' }}
          path: |
            *.png
            *.log
            wayland.*
            x11.*
            files.txt
            stranger.log
            packaging/nix/flake.lock
            packaging/nix/flake.nix
          if-no-files-found: warn
