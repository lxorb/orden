name: web-under-win-probe

on:
  push:
    branches: ['tmp/ci-2224-under']
  workflow_dispatch:

concurrency:
  group: web-under-win-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.under
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-pc-windows-msvc

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          bash scripts/linux-cef.sh tauri build --target x86_64-pc-windows-msvc --no-bundle \
            --ignore-version-mismatches --config "$config"
          bash scripts/cef-beside.sh apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release

      - name: Probed as today
        run: |
          python -m pip install --quiet pillow comtypes
          python scripts/web-under-win-probe.py --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" --identifier "$IDENTIFIER" --out probe/default

      - name: Probed with the page under the app
        if: always()
        run: |
          python scripts/web-under-win-probe.py --exe "$PWD/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/orden.exe" --identifier "$IDENTIFIER" --out probe/under --under

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-under-win-probe
          path: probe
          retention-days: 5
