name: agent-parity

# One agent's browser script against every engine an agent's tab runs on (#1092):
# scripts/agent-parity.py, on a probe build of each - WKWebView on a Mac, WebView2 on
# Windows, Orden's own Chromium on Linux. Every verb answers as on the others, or
# `unsupported_on_this_engine` exactly where that engine's table says, so a tool missing
# on one engine fails here. Nobody is at a runner, so a window on its screen is nobody's;
# and on a Mac an agent's page runs only while the window is on a screen (docs/agent-
# native.md 12.2), so the window stays where the app puts it.

on:
  pull_request:
    branches: [main]
    # `ready_for_review` too: a draft runs nothing, and the full run starts the moment
    # it is marked ready (see docs/conventions.md, "CI").
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/desktop/src-tauri/src/agents/**
      - apps/desktop/src-tauri/Cargo.toml
      - scripts/agent-parity.py
      - .github/workflows/agent-parity.yml
  workflow_dispatch:

concurrency:
  group: agent-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    # Not on a draft; see the `pull_request` trigger above.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            engine: wkwebview
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            engine: webview2
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            engine: chromium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: ch.emilvinu.nib.probe.agent-parity
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      # A probe build: a version no release passes and an updater pointed at nothing, so
      # it can never install anything over anything; see scripts/probe_app.py. A Mac's is
      # a bundle, which is what gives it an identifier of its own to keep its stores by.
      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          case "$RUNNER_OS" in
            Linux)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --no-bundle \
                --ignore-version-mismatches --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/nib" >>"$GITHUB_ENV"
              ;;
            macOS)
              pnpm --filter @orden/desktop exec tauri build --target ${{ matrix.target }} --bundles app --config "$config"
              app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
              echo "EXE=$PWD/$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" >>"$GITHUB_ENV"
              ;;
            Windows)
              pnpm --filter @orden/desktop exec tauri build --target ${{ matrix.target }} --no-bundle --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/nib.exe" >>"$GITHUB_ENV"
              ;;
          esac

      # And Chromium's sandbox helper beside the binary, which it refuses to start
      # without unless root owns it with its set-user bit, as the packages install it.
      - name: A screen, on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11
          sandbox="$(dirname "$EXE")/chrome-sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

      - name: The script, on ${{ matrix.engine }}
        run: |
          parity=(scripts/agent-parity.py --exe "$EXE" --identifier "$IDENTIFIER" --engine ${{ matrix.engine }} --out parity-${{ matrix.engine }}.json)
          case "$RUNNER_OS" in
            Linux) xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 "${parity[@]}" ;;
            Windows) python "${parity[@]}" ;;
            *) python3 "${parity[@]}" ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-parity-${{ matrix.engine }}
          path: parity-${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 14
