name: agent-parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/desktop/src-tauri/src/agents/**
      - apps/desktop/src-tauri/Cargo.toml
      - scripts/agent-parity.py
      - .github/workflows/agent-parity.yml
  workflow_dispatch:

concurrency:
  group: agent-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            engine: chromium
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            engine: chromium
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            engine: chromium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IDENTIFIER: so.orden.Orden.probe.agent-parity
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      - name: The probe
        run: |
          source scripts/edge-profile.sh
          config='{"identifier":"'"$IDENTIFIER"'","version":"99.0.0","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"]}}}'
          case "$RUNNER_OS" in
            Linux)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --no-bundle \
                --ignore-version-mismatches --config "$config"
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/orden" >>"$GITHUB_ENV"
              ;;
            macOS)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --bundles app \
                --ignore-version-mismatches --config "$config"
              app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
              echo "EXE=$PWD/$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" >>"$GITHUB_ENV"
              ;;
            Windows)
              bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} --no-bundle \
                --ignore-version-mismatches --config "$config"
              bash scripts/cef-beside.sh apps/desktop/src-tauri/target/${{ matrix.target }}/release
              echo "EXE=$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/orden.exe" >>"$GITHUB_ENV"
              ;;
          esac

      - name: A screen, on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11
          sandbox="$(dirname "$EXE")/chrome-sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

      - name: The script, on ${{ matrix.engine }}
        run: |
          parity=(scripts/agent-parity.py --exe "$EXE" --identifier "$IDENTIFIER" --engine ${{ matrix.engine }} --out parity-${{ matrix.engine }}.json)
          case "$RUNNER_OS" in
            Linux) xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- python3 "${parity[@]}" ;;
            Windows) python "${parity[@]}" ;;
            *) python3 "${parity[@]}" ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-parity-${{ runner.os }}
          path: parity-${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 14
