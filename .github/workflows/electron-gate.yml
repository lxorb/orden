name: electron-gate

on:
  push:
    branches: ['tmp/electron-gate-*']
  workflow_dispatch:

concurrency:
  group: electron-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg unzip
          GITHUB_TOKEN=${{ github.token }} bash apps/desktop-electron/gate/assets.sh "$RUNNER_TEMP/assets"
      - name: Orden's frontend
        run: |
          pnpm install --frozen-lockfile
          cd apps/desktop
          pnpm exec vite build --mode drive --outDir "$RUNNER_TEMP/assets/orden-dist" --emptyOutDir
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-assets
          path: ${{ runner.temp }}/assets
          retention-days: 3

  gate:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
          - runner: windows-latest
            name: windows-x64
          - runner: windows-11-arm
            name: windows-arm64
          - runner: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-electron
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-assets
          path: apps/desktop-electron/assets
      - name: Install
        run: |
          npm install --no-audit --no-fund
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update -q
              sudo apt-get install -y -q xvfb dbus-x11 openbox xdotool at-spi2-core python3-gi gir1.2-atspi-2.0
              echo "GATE_A11Y_PY=/usr/bin/python3" >>"$GITHUB_ENV"
              python3 -m venv "$RUNNER_TEMP/gate"
              "$RUNNER_TEMP/gate/bin/pip" install --quiet mss pillow
              echo "GATE_PY=$RUNNER_TEMP/gate/bin/python" >>"$GITHUB_ENV"
              ;;
            Windows)
              python -m pip install --quiet mss pillow
              echo "GATE_PY=python" >>"$GITHUB_ENV"
              ;;
            macOS)
              python3 -m venv "$RUNNER_TEMP/gate"
              "$RUNNER_TEMP/gate/bin/pip" install --quiet mss pillow pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
              echo "GATE_PY=$RUNNER_TEMP/gate/bin/python" >>"$GITHUB_ENV"
              ;;
          esac
      - name: Machine
        run: |
          node -e "const os=require('os');console.log(JSON.stringify({cpus:os.cpus().length,model:os.cpus()[0].model,memGB:Math.round(os.totalmem()/2**30),release:os.release(),arch:os.arch()}))" | tee machine.json
      - name: A desktop to drive
        if: runner.os == 'Windows'
        run: |
          mkdir -p out
          "$GATE_PY" gate/osio.py grab out/desktop-before.png || true
          for at in "866 656" "866 656" "866 656" "866 656"; do "$GATE_PY" gate/osio.py click $at || true; sleep 2; done
          "$GATE_PY" gate/osio.py grab out/desktop-after.png || true
      - name: Gate
        run: |
          export GATE_ASSETS="$PWD/assets" GATE_OUT="$PWD/out"
          mkdir -p out
          cp machine.json out/
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -c 'openbox & sleep 1; exec node gate/run.cjs' || true
          else
            node gate/run.cjs || true
          fi
      - name: Package
        run: node gate/pack.cjs gate-${{ matrix.name }}
      - name: Results
        if: always()
        run: |
          node gate/report.cjs out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate-results-${{ matrix.name }}
          path: apps/desktop-electron/out
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate-app-${{ matrix.name }}
          path: apps/desktop-electron/gate-${{ matrix.name }}.zip
          retention-days: 14
          compression-level: 0
