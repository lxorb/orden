name: publish-even

# What gets a new build of the G2 plugin in front of the beta testers. The rule
# in docs/even.md is that every repack bumps `version` in even.app.json, so that
# bump is the whole trigger: nothing else in the app can start a publish, and a
# push that only touches the manifest without moving the version does nothing.
on:
  push:
    branches: [main]
    paths: [apps/desktop/even.app.json]
  # A run that failed on a bad secret, or a build that needs to go somewhere
  # other than the testers, can be sent through by hand.
  workflow_dispatch:
    inputs:
      branch:
        description: The Even Hub branch to put the build on
        default: beta

concurrency:
  group: publish-even
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A job cannot ask `if: secrets.X != ''`, and it cannot read the previous
  # commit either, so both questions are settled here and passed down as plain
  # strings.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      package: ${{ steps.gate.outputs.package }}
      version: ${{ steps.gate.outputs.version }}
      changelog: ${{ steps.gate.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          # This commit only. The manifest the push started from is fetched by
          # its own hash below, which is one object however long the history
          # gets, and which HEAD^ is not when a push carried several commits.
          fetch-depth: 1

      - id: gate
        env:
          MANIFEST: apps/desktop/even.app.json
          # Each on its own, because either one missing is a publish that would
          # get as far as the sign in and stop there. Neither is ever printed;
          # what the script tests is whether the string is empty.
          EMAIL: ${{ secrets.EVENHUB_EMAIL }}
          PASSWORD: ${{ secrets.EVENHUB_PASSWORD }}
          # Through the environment rather than interpolated into the script: a
          # commit message is somebody's prose, and a `${{ }}` of it would be
          # pasted in as shell.
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          # What this push started from, which is not the same as HEAD^ when the
          # push carried more than one commit.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          package=$(node -p "require('./$MANIFEST').package_id ?? ''")
          version=$(node -p "require('./$MANIFEST').version ?? ''")

          # A manifest missing either of them would publish as an empty package
          # id, which the portal answers with something unhelpful.
          if [ -z "$package" ] || [ -z "$version" ]; then
            echo "::error::$MANIFEST names no package_id or no version."
            exit 1
          fi

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # One line of it, and the version when there is no commit behind this
          # run at all, which is every run started by hand.
          changelog=$(printf '%s' "${MESSAGE:-}" | head -1 | cut -c1-500)
          echo "changelog=${changelog:-$version}" >> "$GITHUB_OUTPUT"

          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo '::notice::EVENHUB_EMAIL and EVENHUB_PASSWORD are not both set - skipping the publish.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A first push to the branch has no commit before it, and a force push
          # may name one that is gone; either reads as no manifest, which is a
          # version this run has not seen and so a publish.
          echo '{}' > before.json
          if git fetch --depth=1 --no-tags origin "$BEFORE" 2> /dev/null; then
            git show "$BEFORE:$MANIFEST" > before.json 2> /dev/null || echo '{}' > before.json
          fi

          if [ "$version" = "$(node -p "require('./before.json').version ?? ''")" ]; then
            echo "::notice::even.app.json is still at $version, and a repack bumps it - nothing to publish."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same two commands docs/even.md gives for doing this by hand.
      - name: Build the plugin
        run: pnpm --filter @nib/desktop build:even

      # Pinned to the version docs/even.md was written against. `npx` with no
      # version fetches and runs whatever was published this morning, which is
      # somebody else's code deciding what goes in our package.
      - name: Pack it
        run: npx --yes @evenrealities/evenhub-cli@0.1.14 pack apps/desktop/even.app.json apps/desktop/dist-even -o nib.ehpk

      # Pinned to a commit and not to `v1`. This is the one step that is handed
      # the Even account's own password rather than a token scoped to anything,
      # and a tag is a name its owner can move: pinning means the code that gets
      # the password is the code that was read.
      - uses: lxorb/evenhub-publish@13791357d7737735801747fffb389a71c6fd1b68 # v1
        with:
          package-id: ${{ needs.gate.outputs.package }}
          ehpk: nib.ehpk
          version: ${{ needs.gate.outputs.version }}
          changelog: ${{ needs.gate.outputs.changelog }}
          branch: ${{ inputs.branch || vars.EVENHUB_BRANCH || 'beta' }}
          email: ${{ secrets.EVENHUB_EMAIL }}
          password: ${{ secrets.EVENHUB_PASSWORD }}
