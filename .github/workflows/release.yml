name: release

# Two kinds of release come out of here. A tag `v*` is a release proper, with
# its own page and its own number, and those tags are cut on main: main carries
# releases and nothing else. Every push to `unstable` is a build as well, for
# the people who follow the edge rather than the releases. Those builds land on
# one rolling pre-release tagged `edge`, replaced each time - not `unstable`,
# since a tag sharing a name with the branch makes every checkout of it
# ambiguous.
#
# Nix is not served from here. The stable flake in packaging/nix follows the
# release, and anyone who wants the edge builds it from the `unstable` branch
# themselves; there is no branch holding a flake pinned to edge's binaries.
on:
  push:
    tags: ['v*']
    branches: [unstable]
  workflow_dispatch:
    inputs:
      runners:
        description: 'Where the Windows jobs run: azure when the repository has it on (Spot first, or ondemand), or github'
        type: choice
        options: [auto, ondemand, github]
        default: auto

# A build of `unstable` is never cancelled by a newer push: pushes came faster
# than a build takes, so none ever finished and edge stood still. The running
# one finishes, and only the newest push waits behind it. A tag is a release of
# its own and is never cancelled; a dispatch on another branch is a trial, and
# the newer one replaces it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/unstable' && !startsWith(github.ref, 'refs/tags/') }}

# The floor, so a job added below without a block of its own still only reads.
# Every job states its own as well, because what a job may do is part of what the
# job is.
permissions:
  contents: read

jobs:
  # What this build is called; see scripts/build-version.sh.
  version:
    runs-on: ubuntu-latest
    # All but one of the jobs below may only read; the one that writes says so.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history, so the newest tag can be found from main.
          fetch-depth: 0

      - id: decide
        shell: bash
        run: bash scripts/build-version.sh edge

  # With Azure on, a push to `unstable` is built only once the branch has been still
  # for a few minutes: pushes come in bursts, and a build that a newer one replaces
  # anyway is money for nothing. The newest push of a burst builds; the others end
  # here, before any machine exists. A tag, a dispatch or Azure off: no waiting.
  settle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable' && vars.NIB_CI_AZURE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      newest: ${{ steps.wait.outputs.newest }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SETTLE_S: ${{ vars.NIB_CI_SETTLE_S || '300' }}
        run: |
          # From the push, not from now: a run that queued behind another has waited already.
          pushed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          left=$(($(date -d "$pushed" +%s) + SETTLE_S - $(date +%s)))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "newest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          [ "$head" = "$GITHUB_SHA" ] || echo "main moved on to $head, which builds instead"

  # Azure machines for the slowest Windows jobs, when the repository variable
  # NIB_CI_AZURE is `on`; see .github/azure/machines.sh. Done as soon as Azure has
  # accepted them, so nothing else waits for a machine to boot, and a row no region
  # took simply runs on GitHub's own runner. A push, a tag or a maintainer's dispatch
  # only: nothing from a pull request ever reaches these machines.
  machines:
    needs: settle
    if: ${{ !cancelled() && vars.NIB_CI_AZURE == 'on' && vars.NIB_CI_ROWS != '' && inputs.runners != 'github' && needs.settle.outputs.newest != 'false' }}
    runs-on: ubuntu-latest
    environment: azure-ci
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      # Which jobs get a machine: the repository variable NIB_CI_ROWS, and none without
      # it. The one row this had by default was nib's own Chromium on x64, which is gone;
      # the installers would wait longer for what the image lacks than they take on
      # GitHub's own runners (.github/azure/boot.ps1).
      ROWS: ${{ vars.NIB_CI_ROWS }}
      # After Azure took a Spot machine back mid-job, the run starts again on demand.
      NIB_CI_SPOT: ${{ inputs.runners == 'ondemand' && 'off' || 'on' }}
    outputs:
      runners: ${{ steps.start.outputs.runners }}
      rows: ${{ steps.start.outputs.rows }}
    steps:
      - &azure-checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/azure
      - &azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Just-in-time runners are registered with the CI app's token; the runner on a
      # machine only ever holds its own one-job registration.
      - &azure-app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NIB_CI_APP_ID }}
          private-key: ${{ secrets.NIB_CI_APP_KEY }}
      # Keyed by attempt as well: a re-run of one failed job reuses these outputs, and
      # an earlier attempt's machine is gone by then, so that job goes to GitHub.
      - id: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export NIB_CI_RUNNERS="$RUNNER_TEMP/runners.json"
          # shellcheck disable=SC2086
          bash .github/azure/machines.sh start $ROWS
          runners=$(cat "$NIB_CI_RUNNERS")
          echo "runners=$(jq -c --arg a "$GITHUB_RUN_ATTEMPT" 'with_entries(.key = "\($a)/\(.key)")' <<<"$runners")" >>"$GITHUB_OUTPUT"
          # The rows that got a machine, for machines-online to wait on.
          echo "rows=$(for spec in $ROWS; do jq -e --arg k "${spec%%=*}" 'has($k)' <<<"$runners" >/dev/null && printf '%s ' "$spec"; done)" >>"$GITHUB_OUTPUT"

  # Until every machine's runner is online. One that never comes gets one more machine
  # elsewhere; when that fails as well, the run starts again on GitHub's runners, since
  # its job would otherwise wait for a runner that will never come.
  machines-online:
    needs: machines
    if: ${{ !cancelled() && needs.machines.outputs.rows != '' }}
    runs-on: ubuntu-latest
    environment: azure-ci
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - *azure-checkout
      - *azure-login
      - *azure-app
      - name: Wait for the runners
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # shellcheck disable=SC2086
          bash .github/azure/machines.sh watch ${{ needs.machines.outputs.rows }}
      - name: Start again on GitHub's runners
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f runners=github
          gh run cancel "$GITHUB_RUN_ID"

  build:
    needs: [version, settle, machines]
    # Whether or not there are machines; not when a newer push builds instead.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.settle.outputs.newest != 'false' }}
    # It reads the repository and uploads an artifact, which travels on the
    # runtime's own token rather than on this one.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          # One download that runs on every Mac, Intel or Apple silicon, which
          # needs both architectures installed to lipo together.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
            rust: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ fromJSON(needs.machines.outputs.runners || '{}')[format('{0}/{1}', github.run_attempt, matrix.label)] || matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Not on Linux arm, the one store no other job shares: the repository's
          # cache holds 10 GB, and half a gigabyte saved for a job with time to
          # spare pushed out a Rust cache a slower job needed.
          cache: ${{ matrix.platform != 'ubuntu-22.04-arm' && 'pnpm' || '' }}
          package-manager-cache: ${{ matrix.platform != 'ubuntu-22.04-arm' }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable branch
        with:
          # Named, and not left to the `@stable` the ref used to carry: with the
          # action pinned to a commit, the ref no longer says which toolchain to
          # install, and this is the input that does.
          toolchain: stable
          # Universal is a Tauri target, not a rustup one, so that row names the
          # real targets itself. Everything else builds for what it runs on.
          targets: ${{ matrix.rust || matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: ${{ matrix.target }}
          # Saved from main only: a cache is read only on the ref that saved it and the
          # ones below it, and the repository's free 10 GB have nothing to spare for a
          # tag's or a trial branch's.
          save-if: ${{ github.ref == 'refs/heads/unstable' }}

      # xdg-utils is what the AppImage bundler copies `xdg-open` from; the x64
      # image happens to ship it, the arm image does not.
      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      # A Developer ID and notarization, once the secrets exist. Without them the
      # bundle keeps the ad-hoc signature tauri.conf.json asks for, which Apple
      # silicon needs to run it at all. Exported only when set: the bundler reads
      # an empty APPLE_SIGNING_IDENTITY as an identity named "".
      - name: Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            { echo "$name<<__nib_eof__"; echo "$value"; echo "__nib_eof__"; } >> "$GITHUB_ENV"
          done

      # Signed so the updater will accept them. Without the key the build still
      # succeeds; it just produces bundles that cannot be auto-installed.
      #
      # The version is passed in rather than read from tauri.conf.json, so a
      # build of main carries the number the manifest will claim for it.
      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          pnpm --filter @nib/desktop exec tauri build --target ${{ matrix.target }} \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nib-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # One manifest for every platform, which is what the app polls.
  #
  # A release's own page is for people: the installers, under the product's name, and
  # latest.json, which every install asks for at releases/latest/download. What the app
  # downloads by itself goes on one pre-release, `updates`, beside every other version's:
  # the bundles the updater installs. They keep the name `Nib-`, because every build
  # before 0.14 takes an update only from a file called that (`names()` in
  # src-tauri/src/updates.rs), and the one manifest serves them all. A build of main keeps everything on `edge`, as it always has.
  publish:
    needs: [version, build]
    # Only `unstable` and tags: a dispatch on any other branch is a trial and
    # publishes nothing (it would otherwise replace edge).
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    # The one job that writes: the release and its files are the point of it.
    permissions:
      contents: write
      # To dispatch publish.yml, publish-linux.yml and packaging-bump.yml at the
      # end of this job.
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      ROLLING: ${{ needs.version.outputs.rolling }}
      # Where the files the app downloads by itself go.
      FILES: ${{ needs.version.outputs.rolling == 'true' && needs.version.outputs.tag || 'updates' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts }

      # Before the manifest, which builds its download URLs from the filenames.
      - name: Name the downloads for humans
        run: node scripts/name-assets.mjs artifacts "$VERSION"

      - name: Build latest.json
        run: node scripts/update-manifest.mjs "$FILES" "$VERSION" artifacts > latest.json

      # The rolling release is remade rather than added to: an old build's
      # files under a new manifest would be the worst of both.
      - name: Replace the build of main
        if: needs.version.outputs.rolling == 'true'
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "main · $VERSION" \
            --notes ""

      - name: Publish the release
        if: needs.version.outputs.rolling != 'true'
        run: gh release create "$TAG" --title "$TAG" --notes "" || true

      # Made by the first release that needs it, and a pre-release, so it is never the
      # latest one.
      - name: The release the app downloads from
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh release view "$FILES" >/dev/null 2>&1 ||
            gh release create "$FILES" --prerelease --target "$GITHUB_SHA" --title "$FILES" --notes ""

      - name: Upload the files
        run: |
          # Every file before the manifest that names it: the updater is never offered
          # a version whose installer is still on its way.
          if [ "$ROLLING" = true ]; then
            # The .app.tar.gz is what the updater downloads on a Mac, so it has to
            # be a release asset even though nobody clicks it.
            find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
              -exec gh release upload "$TAG" {} --clobber \;
          else
            # What latest.json names: the setups, the AppImages and the Mac's .app.tar.gz.
            find artifacts -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) \
              -exec gh release upload "$FILES" {} --clobber \;
            # And the installers, under the product's name, on the release's own page.
            mkdir installers
            find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) |
              while read -r file; do
                name=$(basename "$file")
                cp "$file" "installers/Orden-${name#Nib-}"
              done
            ls -l installers
            gh release upload "$TAG" installers/* --clobber
          fi
          gh release upload "$TAG" latest.json --clobber

      # GitHub creates no workflow run for an event raised by GITHUB_TOKEN, so
      # the release published above never reaches publish.yml's `on: release`, nor
      # publish-linux.yml's. workflow_dispatch is the documented exception to that
      # rule, so the release hands itself over explicitly. Only a real tag: `edge` is
      # remade on every push to main and is not something to publish anywhere. And to
      # packaging-bump.yml, which moves the manifests in packaging/ onto it, the flake
      # people install from this repository first of all.
      - name: Hand the release to the package managers
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run publish-linux.yml -f tag="$TAG"
          gh workflow run packaging-bump.yml -f tag="$TAG"

  # A Spot machine is Azure's to take back at any moment, and a job whose machine went
  # mid-build fails with its runner lost. Then the run starts again with machines on
  # demand, once: a build that failed on its own merits fails the same way again.
  machines-again:
    needs: [machines, build]
    if: failure() && needs.machines.result == 'success' && inputs.runners != 'ondemand'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lost=0
          # The jobs that failed on a Spot machine (runner nib-<run>-<row>-s<try>).
          for job in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" and ((.runner_name // "") | test("^nib-.*-s[0-9]+$"))) | .id'); do
            if gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" --jq '.[].message' |
              grep -qiE 'lost communication|shutdown signal|runner has received'; then
              echo "job $job lost its Spot machine"
              lost=1
            fi
          done
          [ "$lost" = 1 ] || exit 0
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f runners=ondemand

  # The first of the three things that delete the Azure machines (the sweeper and the
  # machines themselves are the others): whatever the jobs did, failed or cancelled.
  machines-down:
    needs: [machines, build]
    if: always() && needs.machines.result != 'skipped'
    runs-on: ubuntu-latest
    environment: azure-ci
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - *azure-checkout
      - *azure-login
      - *azure-app
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash .github/azure/machines.sh down
