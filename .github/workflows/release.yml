name: release

on:
  push:
    tags: ['v*']
    branches: [unstable]
    paths-ignore:
      - '**/*.md'
      - '**/*.test.ts'
      - 'apps/desktop/test/**'
      - 'packages/editor/test/**'
      - 'services/*/test/**'
      - packaging/nix/edge.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/unstable' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: bash scripts/build-version.sh

      - name: OpenCode is the newest
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/opencode.mjs newest

      - id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo 'notes<<NOTES_END'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo 'NOTES_END'
          } >>"$GITHUB_OUTPUT"

  draft:
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make the draft
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "$NOTES"

  settle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      newest: ${{ steps.wait.outputs.newest }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SETTLE_S: ${{ vars.ORDEN_CI_SETTLE_S || '300' }}
          LATER: >-
            [.workflow_runs[] | select(.run_number > $mine and .conclusion != "cancelled") | .run_number]
            | max // empty
        run: |
          pushed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          left=$(($(date -d "$pushed" +%s) + SETTLE_S - $(date +%s)))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          later=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=unstable&event=push&per_page=20" |
            jq -r --argjson mine "$GITHUB_RUN_NUMBER" "$LATER")
          echo "newest=$([ -z "$later" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          [ -z "$later" ] || echo "run $later is newer and builds instead"

  build:
    needs: [version, settle]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.settle.outputs.newest != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}
          node-cache: ${{ matrix.platform != 'ubuntu-24.04-arm' }}

      - name: OpenCode
        shell: bash
        run: node scripts/opencode.mjs fetch ${{ matrix.target }}

      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          ROLLING: ${{ needs.version.outputs.rolling }}
          ORDEN_RELEASE: ${{ needs.version.outputs.rolling == 'false' && !contains(needs.version.outputs.version, '-') }}
        run: |
          source scripts/edge-profile.sh
          if [ "$RUNNER_OS" = Windows ]; then
            export CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=line-tables-only
          fi
          bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} \
            --ignore-version-mismatches \
            --config '{"version":"${{ needs.version.outputs.version }}"}' \
            --config "$(node scripts/opencode.mjs config ${{ matrix.target }})"
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/appimage-carry.sh "$(ls apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -1)" \
              apps/desktop/src-tauri/binaries/opencode-${{ matrix.target }} shared/bin/opencode \
              apps/desktop/src-tauri/licenses/opencode.txt shared/bin/opencode-licenses.txt
          fi

      - name: The OpenCode it carries serves
        shell: bash
        run: |
          bundle=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            bash scripts/opencode-check.sh apps/desktop/src-tauri/target/${{ matrix.target }}/release/opencode.exe
            exit 0
          fi
          out=$(mktemp -d)
          dpkg-deb -x "$(ls "$bundle"/deb/*.deb | head -1)" "$out/deb"
          bash scripts/opencode-check.sh "$out/deb/usr/share/Orden/opencode"
          test -s "$out/deb/usr/share/Orden/opencode-licenses.txt"
          image=$(realpath "$(ls "$bundle"/appimage/*.AppImage | head -1)")
          (cd "$out" && "$image" --appimage-extract >/dev/null)
          bash scripts/opencode-check.sh "$out/squashfs-root/shared/bin/opencode"
          test -s "$out/squashfs-root/shared/bin/opencode-licenses.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orden-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: symbols-${{ matrix.label }}-${{ needs.version.outputs.version }}
          if-no-files-found: warn
          retention-days: 90
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/orden.pdb

      - name: Orden finds and starts the OpenCode it carries
        shell: bash
        run: |
          bundle=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          drive=(scripts/opencode-app-drive.py --identifier so.orden.Orden --exe)
          if [ "$RUNNER_OS" = Windows ]; then
            home="$(cygpath -w "$RUNNER_TEMP")\\opencode-app"
            "/c/Program Files/7-Zip/7z.exe" x -y -o"$home" "$(cygpath -w "$(ls "$bundle"/nsis/*-setup.exe | head -1)")" >/dev/null
            python "${drive[@]}" "$home\\orden.exe"
            exit 0
          fi
          command -v xvfb-run >/dev/null || bash scripts/ci-apt.sh xvfb
          command -v dbus-run-session >/dev/null || bash scripts/ci-apt.sh dbus-x11
          screen=(xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session --)
          sudo apt-get update -q
          sudo apt-get install -y "$(realpath "$(ls "$bundle"/deb/*.deb | head -1)")"
          "${screen[@]}" python3 "${drive[@]}" /usr/share/Orden/orden
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          image=$(realpath "$(ls "$bundle"/appimage/*.AppImage | head -1)")
          chmod +x "$image"
          "${screen[@]}" python3 "${drive[@]}" "$image" --appimage-extract-and-run

  hover:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-11-arm
            label: windows-arm64
            tab_first_ms: 390
          - platform: windows-latest
            label: windows-x64
            tab_first_ms: 235
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orden-${{ matrix.label }}
          path: built

      - name: A hover answers within frames and the app rests when left alone
        run: |
          setup=$(find built -name '*-setup.exe' | head -1)
          home="$(cygpath -w "$RUNNER_TEMP")\\orden"
          "/c/Program Files/7-Zip/7z.exe" x -y -o"$home" "$(cygpath -w "$setup")" >/dev/null
          python scripts/hover-drive.py --exe "$home\\orden.exe" --identifier so.orden.Orden

      - name: The overview opens, moves and answers within this platform's limits
        run: |
          python -m pip install --quiet pillow mss numpy
          python scripts/overview-perf-drive.py --exe "$(cygpath -w "$RUNNER_TEMP")\\orden\\orden.exe" \
            --identifier so.orden.Orden --out overview-perf --limits

      - name: A tab switch shows its tab and takes keys within this platform's limits
        if: ${{ !cancelled() }}
        env:
          TAB_FIRST_MS: ${{ matrix.tab_first_ms }}
        run: |
          python -m pip install --quiet pillow mss numpy
          python scripts/tab-switch-drive.py --exe "$(cygpath -w "$RUNNER_TEMP")\\orden\\orden.exe" \
            --identifier so.orden.Orden --out overview-perf/tabs --fail-over "$TAB_FIRST_MS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: overview-perf-${{ matrix.label }}-${{ github.run_attempt }}
          path: overview-perf
          retention-days: 7
          if-no-files-found: ignore

  mac:
    needs: [version, settle]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.settle.outputs.newest != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: macos-arm64
          - target: x86_64-apple-darwin
            label: macos-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      - name: OpenCode
        shell: bash
        run: node scripts/opencode.mjs fetch ${{ matrix.target }}

      - name: Apple signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            { echo "$name<<__orden_eof__"; echo "$value"; echo "__orden_eof__"; } >> "$GITHUB_ENV"
          done

      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          ROLLING: ${{ needs.version.outputs.rolling }}
          ORDEN_RELEASE: ${{ needs.version.outputs.rolling == 'false' && !contains(needs.version.outputs.version, '-') }}
        run: |
          source scripts/edge-profile.sh
          bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} \
            --ignore-version-mismatches \
            --config '{"version":"${{ needs.version.outputs.version }}"}' \
            --config "$(node scripts/opencode.mjs config ${{ matrix.target }})"
          app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          ls "$app/Contents/Frameworks"
          du -sh "$app" apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: The OpenCode it carries serves, signed
        shell: bash
        run: |
          app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/opencode"
          codesign -d --entitlements - "$app/Contents/MacOS/opencode" 2>&1 | grep -E 'allow-jit|Authority|TeamIdentifier' || true
          test -s "$app/Contents/Resources/opencode-licenses.txt"
          bash scripts/opencode-check.sh "$app/Contents/MacOS/opencode"

      - name: Orden finds and starts the OpenCode it carries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            echo "the mac-intel job starts this app on an Intel Mac"
            exit 0
          fi
          app=$(ls -d "$PWD"/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          python3 scripts/opencode-app-drive.py --identifier so.orden.Orden --exe "$app/Contents/MacOS/$exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orden-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  caches:
    needs: [build, mac]
    if: ${{ !cancelled() && github.ref == 'refs/heads/unstable' && (needs.build.result == 'success' || needs.mac.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-caches.sh "$GITHUB_REF"

  mac-intel:
    needs: mac
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: orden-macos-x64
          path: built

      - name: Orden finds and starts the OpenCode it carries, on an Intel Mac
        shell: bash
        run: |
          tar -xzf "$(find built -name '*.app.tar.gz' | head -1)" -C "$RUNNER_TEMP"
          app=$(ls -d "$RUNNER_TEMP"/*.app | head -1)
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          python3 scripts/opencode-app-drive.py --identifier so.orden.Orden --exe "$app/Contents/MacOS/$exe"

  publish:
    needs: [version, draft, build, mac, mac-intel]
    if: ${{ !cancelled() && needs.draft.result != 'failure' && needs.build.result == 'success' && needs.mac.result == 'success' && needs.mac-intel.result == 'success' && (github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      FILES: ${{ needs.version.outputs.rolling == 'true' && needs.version.outputs.tag || 'updates' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: artifacts, pattern: 'orden-*' }

      - name: Name the downloads for humans
        run: node scripts/name-assets.mjs artifacts "$VERSION"

      - name: Build latest.json
        run: node scripts/update-manifest.mjs "$FILES" "$VERSION" artifacts > latest.json

      - name: Point edge at this build
        if: needs.version.outputs.rolling == 'true'
        run: |
          notes="Built from $GITHUB_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$GITHUB_REF_NAME · $VERSION" --notes "$notes"
            if ! moved=$(gh api -i -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true 2>&1); then
              grep -iE '^(HTTP/|x-accepted-github-permissions|x-github-request-id)|"message"' <<<"$moved" || true
              echo "::warning::the $TAG tag could not be moved to $GITHUB_SHA; the release keeps it where it was and takes this build's files"
            fi
          elif ! made=$(gh api -i -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$GITHUB_REF_NAME · $VERSION" \
            -f body="$notes" -F prerelease=true 2>&1); then
            grep -iE '^(HTTP/|x-accepted-github-permissions|x-github-request-id)|"message"' <<<"$made" || true
            echo "::error::$TAG is not there and could not be made"
            exit 1
          fi

      - name: The release the app downloads from
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh release view "$FILES" >/dev/null 2>&1 ||
            gh release create "$FILES" --prerelease --target "$GITHUB_SHA" --title "$FILES" --notes ""

      - name: Upload the files
        run: |
          find artifacts -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -print0 |
            xargs -0 -I{} gh release upload "$FILES" {} --clobber
          mkdir installers
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) |
            while read -r file; do
              cp "$file" installers/
            done
          ls -l installers
          gh release upload "$TAG" installers/* --clobber
          held=$(gh release view "$FILES" --json assets --jq '.assets[].name')
          jq -r '.platforms[].url | split("/") | last' latest.json | sort -u | while read -r name; do
            grep -qxF "$name" <<<"$held" || {
              echo "::error::latest.json names $name, which $FILES does not hold"
              exit 1
            }
          done
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the release
        if: needs.version.outputs.rolling != 'true'
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            out=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [ "$(printf '%s\n%s\n' "$out" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
              gh release edit "$TAG" --draft=false --latest
            else
              gh release edit "$TAG" --draft=false --latest=false
            fi
          fi

      - name: Take the last build's files off edge
        if: needs.version.outputs.rolling == 'true'
        run: |
          { find artifacts installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -printf '%f\n'; echo latest.json; } |
            bash scripts/prune-edge.sh "$TAG" desktop

      - name: Hand the release to the package managers
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run packaging-bump.yml -f tag="$TAG"

  apt:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/apt.yml
    with:
      suite: unstable
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  rpm:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/rpm.yml
    with:
      suite: unstable
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  snap:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  linux:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-linux.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  nix-edge:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: unstable

      - name: Pin orden-unstable to this build
        id: pin
        run: |
          git config user.name lxorbs-minion
          git config user.email 43935334+lxorbs-minion@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch -q origin unstable
            git reset -q --hard FETCH_HEAD
            node scripts/bump-packaging.mjs edge "$VERSION"
            git add packaging/nix/edge.json
            git diff --cached --quiet && break
            git commit -q -m "chore: nix on edge $VERSION" -m "Co-authored-by: Emil Vinu <101118850+lxorb@users.noreply.github.com>"
            git push -q origin HEAD:unstable && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 10
          done
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  nix:
    needs: nix-edge
    if: ${{ !cancelled() && needs.nix-edge.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/nix.yml
    with:
      flake: github:${{ github.repository }}/${{ needs.nix-edge.outputs.sha }}?dir=packaging/nix
      package: orden-unstable

  failed:
    needs: [version, draft, settle, build, hover, mac, mac-intel, caches, publish, apt, rpm, snap, linux, nix-edge, nix]
    if: ${{ failure() && (github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: 2229
    steps:
      - name: Say so on the issue that collects failed releases
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"')
          edge=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/edge" --jq '"\(.name): \(.body)"' 2>/dev/null || echo "no edge release")
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Release run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT) for $GITHUB_REF_NAME at $GITHUB_SHA failed in:" \
            "${jobs:-- (no job reports a failure)}" \
            "Edge is now $edge")
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$body" --jq .html_url
