name: release

on:
  push:
    tags: ['v*']
    branches: [unstable]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.test.ts'
      - 'apps/desktop/test/**'
      - 'packages/editor/test/**'
      - 'packages/glasses/test/**'
      - 'services/*/test/**'
      - packaging/nix/edge.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/unstable' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: bash scripts/build-version.sh

  draft:
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Make the draft
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""

  settle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      newest: ${{ steps.wait.outputs.newest }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SETTLE_S: ${{ vars.NIB_CI_SETTLE_S || '300' }}
          LATER: >-
            [.workflow_runs[] | select(.run_number > $mine and .conclusion != "cancelled") | .run_number]
            | max // empty
        run: |
          pushed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          left=$(($(date -d "$pushed" +%s) + SETTLE_S - $(date +%s)))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          later=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=unstable&event=push&per_page=20" |
            jq -r --argjson mine "$GITHUB_RUN_NUMBER" "$LATER")
          echo "newest=$([ -z "$later" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          [ -z "$later" ] || echo "run $later is newer and builds instead"

  build:
    needs: [version, settle]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.settle.outputs.newest != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}
          node-cache: ${{ matrix.platform != 'ubuntu-24.04-arm' }}

      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          ROLLING: ${{ needs.version.outputs.rolling }}
        run: |
          source scripts/edge-profile.sh
          if [ "$RUNNER_OS" = Windows ]; then
            export CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=line-tables-only
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            bash scripts/linux-cef.sh tauri build --target ${{ matrix.target }} \
              --ignore-version-mismatches \
              --config '{"version":"${{ needs.version.outputs.version }}"}'
          else
            pnpm --filter @orden/desktop exec tauri build --target ${{ matrix.target }} \
              --config '{"version":"${{ needs.version.outputs.version }}"}'
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nib-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: symbols-${{ matrix.label }}-${{ needs.version.outputs.version }}
          if-no-files-found: warn
          retention-days: 90
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/nib.pdb

  mac:
    needs: [version, settle]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.settle.outputs.newest != 'false' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      - name: Build the binary
        shell: bash
        env:
          ROLLING: ${{ needs.version.outputs.rolling }}
        run: |
          source scripts/edge-profile.sh
          pnpm --filter @orden/desktop exec tauri build --target ${{ matrix.target }} --no-bundle \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-half-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/nib

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: mac-app-intents
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/src-tauri/gen/app-intents

  macos:
    needs: [version, mac]
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      UNIVERSAL: apps/desktop/src-tauri/target/universal-apple-darwin/release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mac-half-*
          path: halves

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-app-intents
          path: apps/desktop/src-tauri/gen/app-intents

      - name: One binary of both halves
        shell: bash
        run: |
          mkdir -p "$UNIVERSAL"
          lipo -create -output "$UNIVERSAL/nib" \
            halves/mac-half-aarch64-apple-darwin/nib halves/mac-half-x86_64-apple-darwin/nib
          chmod 755 "$UNIVERSAL/nib"
          lipo -info "$UNIVERSAL/nib"

      - name: Apple signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            { echo "$name<<__nib_eof__"; echo "$value"; echo "__nib_eof__"; } >> "$GITHUB_ENV"
          done

      - name: Bundle the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          pnpm --filter @orden/desktop exec tauri bundle --target universal-apple-darwin \
            --config '{"version":"${{ needs.version.outputs.version }}"}'
          lipo -info "$UNIVERSAL/bundle/macos/Orden.app/Contents/MacOS/"*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nib-macos-universal
          if-no-files-found: error
          path: |
            ${{ env.UNIVERSAL }}/bundle/dmg/*.dmg
            ${{ env.UNIVERSAL }}/bundle/macos/*.app.tar.gz
            ${{ env.UNIVERSAL }}/bundle/macos/*.app.tar.gz.sig

  caches:
    needs: [build, macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/unstable' && (needs.build.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-caches.sh "$GITHUB_REF"

  publish:
    needs: [version, draft, build, macos]
    if: ${{ !cancelled() && needs.draft.result != 'failure' && needs.build.result == 'success' && needs.macos.result == 'success' && (github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      FILES: ${{ needs.version.outputs.rolling == 'true' && needs.version.outputs.tag || 'updates' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: artifacts, pattern: 'nib-*' }

      - name: Name the downloads for humans
        run: node scripts/name-assets.mjs artifacts "$VERSION"

      - name: Build latest.json
        run: node scripts/update-manifest.mjs "$FILES" "$VERSION" artifacts > latest.json

      - name: Point edge at this build
        if: needs.version.outputs.rolling == 'true'
        run: |
          notes="Built from $GITHUB_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$GITHUB_REF_NAME · $VERSION" --notes "$notes"
            if ! moved=$(gh api -i -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true 2>&1); then
              grep -iE '^(HTTP/|x-accepted-github-permissions|x-github-request-id)|"message"' <<<"$moved" || true
              echo "::warning::the $TAG tag could not be moved to $GITHUB_SHA; the release keeps it where it was and takes this build's files"
            fi
          elif ! made=$(gh api -i -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$GITHUB_REF_NAME · $VERSION" \
            -f body="$notes" -F prerelease=true 2>&1); then
            grep -iE '^(HTTP/|x-accepted-github-permissions|x-github-request-id)|"message"' <<<"$made" || true
            echo "::error::$TAG is not there and could not be made"
            exit 1
          fi

      - name: The release the app downloads from
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh release view "$FILES" >/dev/null 2>&1 ||
            gh release create "$FILES" --prerelease --target "$GITHUB_SHA" --title "$FILES" --notes ""

      - name: Upload the files
        run: |
          find artifacts -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -print0 |
            xargs -0 -I{} gh release upload "$FILES" {} --clobber
          mkdir installers
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) |
            while read -r file; do
              name=$(basename "$file")
              cp "$file" "installers/Orden-${name#Nib-}"
            done
          ls -l installers
          gh release upload "$TAG" installers/* --clobber
          held=$(gh release view "$FILES" --json assets --jq '.assets[].name')
          jq -r '.platforms[].url | split("/") | last' latest.json | sort -u | while read -r name; do
            grep -qxF "$name" <<<"$held" || {
              echo "::error::latest.json names $name, which $FILES does not hold"
              exit 1
            }
          done
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the release
        if: needs.version.outputs.rolling != 'true'
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            out=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [ "$(printf '%s\n%s\n' "$out" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
              gh release edit "$TAG" --draft=false --latest
            else
              gh release edit "$TAG" --draft=false --latest=false
            fi
          fi

      - name: Take the last build's files off edge
        if: needs.version.outputs.rolling == 'true'
        run: |
          { find artifacts installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -printf '%f\n'; echo latest.json; } |
            bash scripts/prune-edge.sh "$TAG" desktop

      - name: Hand the release to the package managers
        if: needs.version.outputs.rolling != 'true'
        run: |
          gh workflow run publish.yml -f tag="$TAG"
          gh workflow run packaging-bump.yml -f tag="$TAG"

  apt:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/apt.yml
    with:
      suite: unstable
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  rpm:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/rpm.yml
    with:
      suite: unstable
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  snap:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  linux:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-linux.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  nix-edge:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.version.outputs.rolling == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: unstable

      - name: Pin orden-unstable to this build
        id: pin
        run: |
          git config user.name lxorbs-minion
          git config user.email 43935334+lxorbs-minion@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch -q origin unstable
            git reset -q --hard FETCH_HEAD
            node scripts/bump-packaging.mjs edge "$VERSION"
            git add packaging/nix/edge.json
            git diff --cached --quiet && break
            git commit -q -m "chore: nix on edge $VERSION" -m "Co-authored-by: Emil Vinu <101118850+lxorb@users.noreply.github.com>"
            git push -q origin HEAD:unstable && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 10
          done
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  nix:
    needs: nix-edge
    if: ${{ !cancelled() && needs.nix-edge.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/nix.yml
    with:
      flake: github:${{ github.repository }}/${{ needs.nix-edge.outputs.sha }}?dir=packaging/nix
      package: orden-unstable
