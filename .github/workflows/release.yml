name: release

# Two kinds of release come out of here. A tag `v*` is a release proper, with
# its own page and its own number. Every push to main is a build as well: the
# desktop app follows main the way nibeditor.com does, so what is on main is
# what people run, not only what was last tagged. Those builds land on one
# rolling pre-release tagged `edge`, replaced each time - not `main`, since a
# tag sharing a name with the branch makes every `git checkout main` ambiguous.
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# A newer push to main supersedes the build of an older one: only the newest
# is worth finishing. A tag is a release of its own and is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # What this build is called, decided once for every platform.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the newest tag can be found from main.
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One patch past the newest tag, with a pre-release number that only
          # ever goes up. Semver puts 0.1.2-57 above 0.1.1 and below 0.1.2, so
          # the app takes each main build and then the release that follows.
          # Digits only in the pre-release, because the MSI bundler turns it
          # into a fourth version number and accepts nothing else there.
          latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "version=$major.$minor.$((patch + 1))-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=edge" >> "$GITHUB_OUTPUT"
          echo "rolling=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          # One download that runs on every Mac, Intel or Apple silicon, which
          # needs both architectures installed to lipo together.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
            rust: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # No version here: it comes from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal is a Tauri target, not a rustup one, so that row names the
          # real targets itself. Everything else builds for what it runs on.
          targets: ${{ matrix.rust || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # xdg-utils is what the AppImage bundler copies `xdg-open` from; the x64
      # image happens to ship it, the arm image does not.
      - name: System dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      # Signed so the updater will accept them. Without the key the build still
      # succeeds; it just produces bundles that cannot be auto-installed.
      #
      # The version is passed in rather than read from tauri.conf.json, so a
      # build of main carries the number the manifest will claim for it.
      - name: Build the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          pnpm --filter @nib/desktop exec tauri build --target ${{ matrix.target }} \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - uses: actions/upload-artifact@v4
        with:
          name: nib-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # One manifest for every platform, which is what the app polls.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # Before the manifest, which builds its download URLs from the filenames.
      - name: Name the downloads for humans
        run: node scripts/name-assets.mjs artifacts "$VERSION"

      - name: Build latest.json
        run: node scripts/update-manifest.mjs "$TAG" "$VERSION" artifacts > latest.json

      # The rolling release is remade rather than added to: an old build's
      # files under a new manifest would be the worst of both.
      - name: Replace the build of main
        if: needs.version.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "main · $VERSION" \
            --notes "Built from \`${GITHUB_SHA::7}\` on main. Replaced by every push; the desktop app updates itself from here."

      - name: Publish the release
        if: needs.version.outputs.rolling != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes || true

      - name: Upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          # The .app.tar.gz is what the updater downloads on a Mac, so it has to
          # be a release asset even though nobody clicks it.
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec gh release upload "$TAG" {} --clobber \;
