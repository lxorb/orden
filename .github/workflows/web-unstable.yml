name: web-unstable

on:
  push:
    branches: [unstable]
    paths-ignore:
      - '**/*.md'
      - '**/*.test.ts'
      - 'apps/desktop/test/**'
      - 'packages/editor/test/**'
      - 'services/**'
      - 'packaging/**'
      - 'legal/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/crates/**'
      - 'apps/desktop/src-tauri/gen/**'
      - 'apps/desktop/src-tauri/linux/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Which main is live
        id: live
        working-directory: services/sync
        run: |
          deployments=$(pnpm exec wrangler deployments list --json)
          versions=$(jq -r 'sort_by(.created_on) | reverse | .[] |
            .versions | sort_by(-.percentage) | .[0].version_id' <<<"$deployments")
          live=$(head -1 <<<"$versions")
          main=""
          for version in $versions; do
            annotations=$(pnpm exec wrangler versions view "$version" --json | jq -c '.annotations // {}')
            main=$(jq -r '.["workers/message"] // ""' <<<"$annotations" |
              grep -oE '^main [0-9a-f]{40}' | cut -d' ' -f2 || true)
            [ -n "$main" ] && break
            by=$(jq -r '.["workers/triggered_by"] // ""' <<<"$annotations")
            if [ "$by" != secret ]; then
              echo "::error::The live Worker ($live) is $version's code, which does not say which main it is (made by '$by'). Deploy main to put a known one live; nothing deployed."
              exit 1
            fi
            echo "$version changed a secret and kept the code deployed before it"
          done
          if [ -z "$main" ]; then
            echo "::error::No deployment of the Worker says which main it is. Deploy main; nothing deployed."
            exit 1
          fi
          echo "Live: main $main, from version $live"
          echo "main=$main" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check out that main
        run: |
          git fetch --no-tags --depth=1 origin "$MAIN"
          git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
          cd "$RUNNER_TEMP/main"
          pnpm install --frozen-lockfile
        env:
          MAIN: ${{ steps.live.outputs.main }}

      - name: Build the unstable web app
        run: |
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<<"${latest:-0.0.0}"
          export ORDEN_RELEASE=unstable ORDEN_VERSION="$major.$minor.$((patch + 1))-$GITHUB_RUN_NUMBER"
          VITE_ORDEN_CHANNEL=unstable pnpm --filter @orden/desktop build --mode web

      - name: The release's web app, where an earlier run built it
        id: release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/release-dist
          key: web-release-${{ steps.live.outputs.main }}

      - name: Build the release's web app once and put the two together
        working-directory: ${{ runner.temp }}/main
        env:
          BUILT: ${{ steps.release.outputs.cache-hit }}
        run: |
          if [ "$BUILT" = true ]; then
            rm -rf apps/desktop/dist
            cp -R "$RUNNER_TEMP/release-dist" apps/desktop/dist
          else
            latest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            ORDEN_RELEASE=true ORDEN_VERSION="$latest" pnpm --filter ./apps/desktop build --mode web
            rm -rf "$RUNNER_TEMP/release-dist"
            cp -R apps/desktop/dist "$RUNNER_TEMP/release-dist"
          fi
          bash scripts/web-channels.sh apps/desktop/dist "$GITHUB_WORKSPACE/apps/desktop/dist"

      - name: Keep the assets of the builds before this one, for the pages still open on them
        id: keep
        env:
          MAIN: ${{ steps.live.outputs.main }}
        run: node scripts/web-keep.mjs "$RUNNER_TEMP/main/apps/desktop/dist" https://app.orden.so 7 "$MAIN"

      - name: Build ordend for the Worker's bundle
        if: steps.keep.outputs.same != 'true'
        working-directory: ${{ runner.temp }}/main
        run: pnpm --filter ./services/machine build

      - name: Deploy the Worker with the edge's pages
        if: steps.keep.outputs.same != 'true'
        working-directory: ${{ runner.temp }}/main
        run: |
          pnpm --filter ./services/sync run deploy \
            --containers-rollout none \
            --tag "main-${MAIN::12}" \
            --message "main $MAIN unstable ${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAIN: ${{ steps.live.outputs.main }}

      - name: Put back a main deploy this queue pushed out
        if: always()
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$head" ] || [ "$head" = "$MAIN" ]; then exit 0; fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -b main -e push -c "$head" -L 1 \
            --json databaseId -q '.[0].databaseId // empty')
          if [ -z "$run" ]; then exit 0; fi
          job=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json jobs \
            -q '.jobs[] | select(.name == "deploy" and .conclusion == "cancelled") | .databaseId')
          if [ -z "$job" ]; then exit 0; fi
          echo "::notice::main's deploy of $head (run $run) was cancelled in the queue; running it again."
          gh run rerun "$run" -R "$GITHUB_REPOSITORY" --job "$job"
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.live.outputs.main }}
