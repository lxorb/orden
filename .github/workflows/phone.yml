name: phone

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The phone app to build and drive'
        type: choice
        required: true
        options: [notes, track, todo, chat, all]
      night:
        description: 'Also build the app as it ships and time its cold start, as the nightly run does'
        type: boolean
        default: false
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      night:
        type: boolean
        default: false
  push:
    branches: [unstable]

permissions:
  contents: read

concurrency:
  group: phone-${{ github.ref }}-${{ inputs.night && 'night' || 'push' }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      go: ${{ steps.touched.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Whether this push touched what a phone runs natively
        id: touched
        env:
          BEFORE: ${{ github.event.before }}
          NATIVE: '^(apps/desktop/src-tauri/gen/android/|apps/desktop/src-tauri/tauri\.[a-z]+\.conf\.json$|apps/desktop/test/e2e/[^/]*phone|apps/desktop/phone-budgets\.json$|scripts/phone-|\.github/workflows/phone\.yml$)'
        run: |
          go=true
          if [ "$GITHUB_REF" = refs/heads/unstable ] && [ "$GITHUB_EVENT_NAME" = push ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$NATIVE" || go=false
          fi
          echo "go=$go" >>"$GITHUB_OUTPUT"

      - name: The apps that have an overlay and a drive
        id: pick
        env:
          ONLY: ${{ inputs.app }}
        run: |
          apps=$(node scripts/phone-apps.mjs --driven "${ONLY:-all}")
          echo "apps=$apps" >>"$GITHUB_OUTPUT"

  android:
    needs: apps
    if: needs.apps.outputs.go == 'true'
    name: ${{ matrix.app }}-android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/desktop/src-tauri/gen/android/build.gradle.kts
            apps/desktop/src-tauri/gen/android/app/build.gradle.kts
            apps/desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: The NDK the crate is cross-compiled with
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: apps/desktop/src-tauri
          shared-key: android-phone
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - run: pip install websocket-client playwright

      - name: Build the app as it ships, to time its cold start
        if: inputs.night
        working-directory: apps/desktop
        env:
          APP: ${{ matrix.app }}
          ORG_GRADLE_PROJECT_ordenApp: ${{ matrix.app }}
          VITE_ORDEN_API: http://127.0.0.1:8799
        run: |
          android=$PWD/src-tauri/gen/android
          keytool -genkeypair -keystore "$android/measure.jks" -alias orden -keyalg RSA -keysize 2048 \
            -validity 2 -storepass orden-measure -keypass orden-measure -dname 'CN=Orden measure'
          {
            echo "storeFile=$android/measure.jks"
            echo "storePassword=orden-measure"
            echo "keyAlias=orden"
            echo "keyPassword=orden-measure"
          } >"$android/keystore.properties"
          pnpm exec tauri android build --apk --target x86_64 --config "src-tauri/tauri.$APP.conf.json"
          mkdir -p ../../out
          cp "$android/app/build/outputs/apk/universal/release/app-universal-release.apk" "../../out/$APP-release.apk"
          rm "$android/keystore.properties" "$android/measure.jks"

      - name: Build the app, driveable, against a server on this machine
        env:
          APP: ${{ matrix.app }}
          ORG_GRADLE_PROJECT_ordenApp: ${{ matrix.app }}
        run: |
          pnpm --filter @orden/desktop exec tauri android build --debug --apk --target x86_64 \
            --config "src-tauri/tauri.$APP.conf.json" \
            --config "{\"build\":{\"beforeBuildCommand\":\"ORDEN_APP=$APP VITE_ORDEN_API=http://127.0.0.1:8799 pnpm exec vite build --mode drive\"}}"
          mkdir -p out
          cp "$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -1)" "out/$APP.apk"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The main path on an emulator, with no crash, ANR or panic
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 apps/desktop/test/e2e/${{ matrix.app }}-phone.py

      - name: What was measured is within the app's budgets
        env:
          APP: ${{ matrix.app }}
        run: node scripts/phone-budget.mjs "$APP" "--from=apps/desktop/test/e2e/shots/$APP-phone/gates.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.app }}-phone
          path: apps/desktop/test/e2e/shots/${{ matrix.app }}-phone/
