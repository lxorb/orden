name: wayland

# Orden on Linux the way a Wayland desktop runs it: every package a Linux reader
# installs, started under a headless sway with three screens - one portrait at 1.77, one
# at 1, one at 1.75 - the desk the first Hyprland report came from. Orden runs on CEF
# (Chromium), whose browsers are X11 windows, so the session has Xwayland, as every
# Wayland desktop does. See scripts/wayland-launch.sh for what each run checks, and
# src-tauri/src/linux.rs and hotkeys/portal.rs for what it checks it of.
#
#   deb       Ubuntu 24.04, and the desktop portal's global shortcuts (a stand-in
#             portal, scripts/wayland-portal.py): the key bound, pressed, and quick add
#             up. And the drive: a web tab's page where its tab is (#387), and what #418
#             asked of CEF, measured beside the last WebKitGTK build on the same runner
#             (scripts/wayland-418.py).
#   appimage  Arch, the newest Mesa and Wayland there are, against what the AppImage
#             carries. No portal for keys, so `--quick-add` handed to the running app
#             instead.
#   rpm       Fedora's own GTK 4 and Mesa.
#
# The packages are built the way release.yml builds them, on the same Ubuntu, as a
# debug build: the bundles are the same and the compile is a third of the time.
#
# The Nix flake has a workflow of its own, its own launch under sway included, in
# nix.yml; this one leaves packaging/nix to it.
# On a pull request into main once it is ready for review, the way check.yml runs, and
# by hand (`gh workflow run wayland.yml --ref <branch>`). Not on a draft, and not on
# `unstable`'s pushes: see docs/conventions.md, "CI".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/lib/web-tab/**'
      - 'apps/desktop/package.json'
      - 'pnpm-lock.yaml'
      - 'packaging/**'
      - '!packaging/nix/**'
      - 'scripts/wayland-*'
      - 'scripts/appimage-trim.sh'
      - '.github/workflows/wayland.yml'
  workflow_dispatch:

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes anywhere.
permissions:
  contents: read

jobs:
  build:
    # Not on a draft; see the `pull_request` trigger above.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build the app and its Linux packages
        # Optimised, so what is timed against a frame - a page's still picture under a
        # menu has 300 ms - is timed against code that runs the way a release runs it.
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_DEV_OPT_LEVEL: '2'
        # The window's own `@tauri-apps/api` and plugin packages are the Tauri 2 ones every
        # other platform builds with; Tauri 3 speaks to them the same way, so the CLI is
        # told to let the versions differ. See scripts/linux-cef.sh.
        run: >-
          bash scripts/linux-cef.sh tauri build --debug --bundles deb,rpm,appimage
          --ignore-version-mismatches
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # What each package carries: the engine, and nothing of WebKitGTK or GStreamer.
      - name: The packages carry CEF and no WebKitGTK
        working-directory: apps/desktop/src-tauri/target/debug/bundle
        run: |
          ls -la deb rpm appimage
          dpkg-deb -I deb/*.deb | sed -n '/Depends/p'
          dpkg-deb -c deb/*.deb | grep -E 'libcef.so|chrome-sandbox|icudtl.dat|v8_context_snapshot.bin|resources.pak'
          if dpkg-deb -I deb/*.deb | grep -iE 'webkit|gstreamer'; then
            echo "::error::the .deb still asks for WebKitGTK or GStreamer"
            exit 1
          fi
          ./appimage/*.AppImage --appimage-extract > /dev/null || true
          ls -d ./*/ || true
          root=$(ls -d squashfs-root AppDir 2>/dev/null | head -1)
          root=${root:-appimage/Orden.AppDir}
          echo "the AppImage, as $root:"
          find "$root" -maxdepth 2 | sort | head -60
          find "$root" -name 'libcef.so*' | grep -q . || { echo "::error::the AppImage carries no libcef.so"; exit 1; }
          if find "$root" -name 'libwebkit2gtk*' -o -name 'libgst*' | grep .; then
            echo "::error::the AppImage carries WebKitGTK or GStreamer"
            exit 1
          fi
          du -sh "$root"
          rm -rf squashfs-root AppDir

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/debug/bundle/deb/*.deb
            apps/desktop/src-tauri/target/debug/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/debug/bundle/appimage/*.AppImage

  # Also the one row that drives the app: a web tab opened on a page of one colour and
  # read off pictures of every screen (scripts/wayland-drive.py).
  deb:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: packages
      - name: The .deb, sway, Mesa and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/deb/*.deb sway xwayland grim dbus python3-gi python3-pil gir1.2-glib-2.0 libgl1-mesa-dri libegl-mesa0 libxkbcommon-tools ffmpeg
      - name: Under Wayland, the portal's key reaching quick add
        env:
          OUT: wayland-out/portal
          PORTAL: '1'
          KEYS: 'the desktop portal, version 2'
          QUICK_ADD_FLOATS: '1'
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/nib
      # Clicked with the compositor's own pointer, so a page over the tab strip takes the
      # click the way it took #387's; and quit and started again four times, a screen each.
      - name: A web tab's page where its tab is, on every screen, under the app's layers
        env:
          OUT: wayland-out/drive
          DRIVE: '1'
          COLD: '4'
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/nib
      # What #418 asked of the engine, measured; the `webkitgtk` job below measures the
      # last WebKitGTK build the same way, for the numbers to be read side by side.
      - name: What #418 asked, on CEF
        if: always()
        env:
          OUT: wayland-out/418-cef
          CHECK: '1'
        run: |
          rm -rf "$HOME/.config/ch.emilvinu.nib" "$HOME/.local/share/ch.emilvinu.nib"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/nib
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayland-deb
          path: wayland-out
          if-no-files-found: ignore

  # The last build on WebKitGTK, the edge release's own .deb, through the same #418 checks
  # on the same kind of runner: what CEF's numbers are read against.
  webkitgtk:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The edge release's .deb, on WebKitGTK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          gh release download edge -R "$GITHUB_REPOSITORY" -p '*-linux-x64.deb' -D packages
          ls -la packages
      - name: The .deb, sway, Mesa and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb sway xwayland grim dbus python3-gi python3-pil gir1.2-glib-2.0 libgl1-mesa-dri libegl-mesa0 libxkbcommon-tools ffmpeg
      - name: What #418 asked, on WebKitGTK
        env:
          OUT: wayland-out/418-webkitgtk
          CHECK: '1'
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/nib
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayland-webkitgtk
          path: wayland-out
          if-no-files-found: ignore

  appimage:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: sway, Mesa and a session bus, as Arch has them today
        # sway's binary carries a file capability a container may not exec with; a copy
        # carries none, and goes first on the path.
        run: |
          pacman -Syu --noconfirm --needed sway xorg-xwayland mesa dbus python git alsa-lib nss
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: packages
      # A container has no FUSE to mount it with, so it is unpacked and its own AppRun
      # started: the same hooks, the same libraries, the same program.
      - name: Unpacked
        run: |
          cd packages/appimage
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
      # As root in a container, where Chromium will not start sandboxed.
      - name: Under Wayland with no portal, `--quick-add` reaching the running app
        env:
          OUT: wayland-out
          KEYS: 'no desktop portal'
          NIB_CEF_SANDBOX: disabled
        run: |
          app="$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
          SECOND="$app --quick-add" dbus-run-session -- bash scripts/wayland-launch.sh "$app"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayland-appimage
          path: wayland-out
          if-no-files-found: ignore

  # #427: the AppImage on Fedora 44, whose Mesa 26.2, libgbm and libglvnd the WebKitGTK
  # one aborted against at start. Under Wayland (sway) and under a bare X server (Xvfb),
  # a picture of each.
  fedora-44:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: sway, Xvfb, Mesa and a session bus, as Fedora 44 has them
        run: |
          dnf install -y sway xorg-x11-server-Xwayland xorg-x11-server-Xvfb xdpyinfo xwininfo mesa-dri-drivers mesa-libEGL mesa-libgbm libglvnd-egl dbus-daemon dbus-tools python3 python3-pillow grim ImageMagick git
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
          rpm -q mesa-libgbm libglvnd
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: packages
      - name: Unpacked
        run: |
          cd packages/appimage
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
      # As root in a container, where Chromium will not start sandboxed.
      - name: Under Wayland
        env:
          OUT: fedora-out/wayland
          NIB_CEF_SANDBOX: disabled
        run: dbus-run-session -- bash scripts/wayland-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - name: Under X11
        if: always()
        env:
          OUT: fedora-out/x11
          NIB_CEF_SANDBOX: disabled
        run: dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fedora-44
          path: fedora-out
          if-no-files-found: ignore

  rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-packages
          path: packages
      - name: The .rpm, sway, Mesa and a session bus
        run: |
          dnf install -y ./packages/rpm/*.rpm sway xorg-x11-server-Xwayland mesa-dri-drivers mesa-libEGL dbus-daemon dbus-tools python3
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
      # As root in a container, where Chromium will not start sandboxed.
      - name: Under Wayland
        env:
          OUT: wayland-out
          NIB_CEF_SANDBOX: disabled
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/nib
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wayland-rpm
          path: wayland-out
          if-no-files-found: ignore
