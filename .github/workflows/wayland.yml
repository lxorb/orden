name: wayland

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/lib/web-tab/**'
      - 'apps/desktop/package.json'
      - 'pnpm-lock.yaml'
      - 'packaging/**'
      - '!packaging/nix/**'
      - 'scripts/wayland-*'
      - 'scripts/appimage-trim.sh'
      - '.github/workflows/wayland.yml'
  workflow_dispatch:

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: ./.github/actions/desktop-setup
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build the app and its Linux packages
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_DEV_OPT_LEVEL: '2'
        run: >-
          bash scripts/linux-cef.sh tauri build --debug --bundles deb,rpm,appimage
          --ignore-version-mismatches
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: The packages carry CEF and no WebKitGTK
        working-directory: apps/desktop/src-tauri/target/debug/bundle
        run: |
          ls -la deb rpm appimage
          dpkg-deb -I deb/*.deb | sed -n '/Depends/p'
          dpkg-deb -c deb/*.deb | grep -E 'libcef.so|chrome-sandbox|icudtl.dat|v8_context_snapshot.bin|resources.pak'
          if dpkg-deb -I deb/*.deb | grep -iE 'webkit|gstreamer'; then
            echo "::error::the .deb still asks for WebKitGTK or GStreamer"
            exit 1
          fi
          ./appimage/*.AppImage --appimage-extract > /dev/null || true
          ls -d ./*/ || true
          root=$(ls -d squashfs-root AppDir 2>/dev/null | head -1)
          root=${root:-appimage/Orden.AppDir}
          echo "the AppImage, as $root:"
          find "$root" -maxdepth 2 | sort | head -60
          find "$root" -name 'libcef.so*' | grep -q . || { echo "::error::the AppImage carries no libcef.so"; exit 1; }
          if find "$root" | grep -E '/mime/packages/|/mimetypes/application-pdf\.'; then
            echo "::error::the AppImage carries a file type's definition or the PDF icon"
            exit 1
          fi
          if find "$root" -name 'libwebkit2gtk*' -o -name 'libgst*' | grep .; then
            echo "::error::the AppImage carries WebKitGTK or GStreamer"
            exit 1
          fi
          du -sh "$root"
          rm -rf squashfs-root AppDir

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/debug/bundle/deb/*.deb
            apps/desktop/src-tauri/target/debug/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/debug/bundle/appimage/*.AppImage

  deb:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: The .deb, sway, Mesa and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/deb/*.deb sway xwayland grim dbus poppler-utils python3-gi python3-pil gir1.2-glib-2.0 libgl1-mesa-dri libegl-mesa0 libxkbcommon-tools ffmpeg xsettingsd wf-recorder libnss3-tools
      - name: The .deb runs as orden, and as nib for the release after the rename
        run: |
          test -x /usr/bin/orden
          test -x /usr/bin/nib
          grep -qx 'exec /usr/bin/orden "$@"' /usr/bin/nib
          grep -qx 'exec /usr/bin/orden "$@"' /usr/share/Orden/nib
      - name: The .deb gives no file type an icon or a definition, Orden owning none
        run: |
          if dpkg-deb -c packages/deb/*.deb | grep -E '/mimetypes/|/mime/packages/'; then
            echo "::error::the .deb carries an icon or a definition for a file type"
            exit 1
          fi
      - name: Under Wayland, the portal's key reaching quick add
        env:
          OUT: wayland-out/portal
          PORTAL: '1'
          KEYS: 'the desktop portal, version 2'
          QUICK_ADD_FLOATS: '1'
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's page where its tab is, on every screen, under the app's layers
        env:
          OUT: wayland-out/drive
          DRIVE: '1'
          COLD: '4'
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's page where its tab is, on a desktop scaled for X11 applications
        if: always()
        env:
          OUT: wayland-out/scaled
          DRIVE: '1'
          DPI: '128'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A light page on its white ground in the app's dark scheme, under sway
        if: always()
        env:
          OUT: wayland-out/ground
          GROUND: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: The first start asks about crash reports once, and the answer is kept
        if: always()
        env:
          OUT: wayland-out/crash-ask
          CRASH_ASK: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: The editor's text size changed from Settings, under sway
        if: always()
        env:
          OUT: wayland-out/textsize
          TEXTSIZE: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Tabs switched in the dark without a white frame, under sway
        if: always()
        env:
          OUT: wayland-out/flash
          FLASH: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A site's certificate from its popover, under sway
        if: always()
        env:
          OUT: wayland-out/cert
          CERT: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: The pages' DNS chosen in Settings, over HTTPS, under sway
        if: always()
        env:
          OUT: wayland-out/dns
          DNS: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A download stopped on its way, and the same name again, under sway
        if: always()
        env:
          OUT: wayland-out/download
          DOWNLOAD: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's extensions in the bar and in Settings, under sway
        if: always()
        env:
          OUT: wayland-out/extensions
          EXTENSIONS: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Pass fills, saves and signs in by itself on a web tab's pages, under sway
        if: always()
        env:
          OUT: wayland-out/pass
          PASS: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A private tab's permission answer kept from normal tabs, under sway
        if: always()
        env:
          OUT: wayland-out/grants
          GRANTS: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A device's name refused for a note and a folder, under sway
        if: always()
        env:
          OUT: wayland-out/reserved
          RESERVED: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A page note made from a PDF wears the PDF's mark, under sway
        if: always()
        env:
          OUT: wayland-out/pdf-mark
          PDFMARK: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A space watched past a folder nobody may read and past the limit, under sway
        if: always()
        env:
          OUT: wayland-out/watch
          WATCH: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A note let go of on a site in a web tab is a file there, under sway
        if: always()
        env:
          OUT: wayland-out/carry
          CARRY: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden" "$HOME/.cache/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's page in the app's scheme, under sway
        if: always()
        env:
          OUT: wayland-out/scheme
          SCHEME: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: What the app took in survives a kill, under sway
        if: always()
        env:
          OUT: wayland-out/kill
          KILL: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's page has its card's rounded corners, under sway
        if: always()
        env:
          OUT: wayland-out/corner
          CORNER: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A press into a web tab's page chooses its tab and its pane, under sway
        if: always()
        env:
          OUT: wayland-out/choosing
          CHOOSING: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Every way a page opens a window does what it asked for, under sway
        if: always()
        env:
          OUT: wayland-out/opens
          OPENS: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Web tabs closed one after another while their pages come up, under sway
        if: always()
        env:
          OUT: wayland-out/closing
          CLOSING: '1'
          RUST_BACKTRACE: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's page has its worker answer it, opened and after a restart, under sway
        if: always()
        env:
          OUT: wayland-out/worker
          WORKER: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: A web tab's session cookie is there after a restart, under sway
        if: always()
        env:
          OUT: wayland-out/session
          SESSION: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Export PDF writes pages and words and nothing from the disk, under sway
        if: always()
        env:
          OUT: wayland-out/pdf
          EXPORTPDF: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Popups chosen from over a web tab's page, under sway
        if: always()
        env:
          OUT: wayland-out/popups
          POPUP: '1'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: Popups chosen from over a web tab's page, under sway, scaled
        if: always()
        env:
          OUT: wayland-out/popups-scaled
          POPUP: '1'
          DPI: '128'
        run: |
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: The window moved by its strip and resized by its edge, under sway
        if: always()
        env:
          OUT: wayland-out/drag
          DRAG: '1'
          IDLE: '1'
        run: |
          echo "left of the runs before:"; pgrep -a orden || true
          pkill -f /usr/share/Orden/orden || true
          rm -rf "$HOME/.config/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - name: What
        if: always()
        env:
          OUT: wayland-out/418-cef
          CHECK: '1'
        run: |
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wayland-deb
          path: wayland-out
          if-no-files-found: ignore

  kwin:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: KWin on X11 as Fedora 44 released it, Xvfb and xdotool
        run: dnf install -y --disablerepo=updates kwin-x11 xorg-x11-server-Xvfb xdpyinfo xwininfo xprop xdotool xwd xterm ImageMagick dbus-daemon dbus-tools python3 procps-ng nss nss-softokn mesa-dri-drivers git ffmpeg-free python3-pillow
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Unpacked
        run: |
          cd packages/appimage
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          [ -d squashfs-root ] || mv AppDir squashfs-root
      - name: Tabs switched in the dark without a white frame, under KWin
        env:
          OUT: kwin-out/flash
          KWIN: '1'
          FLASH: '1'
          ORDEN_CEF_SANDBOX: disabled
        run: dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - name: Popups chosen from over a web tab's page, under KWin
        if: always()
        env:
          OUT: kwin-out/popups
          KWIN: '1'
          POPUP: '1'
          ORDEN_CEF_SANDBOX: disabled
        run: |
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - name: A note dragged in the file list, and the interface zoomed, under KWin
        if: always()
        env:
          OUT: kwin-out/page
          KWIN: '1'
          TREE: '1'
          ZOOM: '1'
          BACK: '1'
          ORDEN_CEF_SANDBOX: disabled
        run: |
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - name: Moved, resized and maximised under KWin
        if: always()
        env:
          OUT: kwin-out
          KWIN: '1'
          IDLE: '1'
          DRAG: '1'
          ORDEN_CEF_SANDBOX: disabled
        run: |
          rm -rf "$HOME/.config/so.orden.Orden" "$HOME/.local/share/so.orden.Orden"
          dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwin
          path: kwin-out
          if-no-files-found: ignore

  webkitgtk:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: The edge release's .deb, on WebKitGTK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          gh release download edge -R "$GITHUB_REPOSITORY" -p '*-linux-x64.deb' -D packages
          ls -la packages
      - name: The .deb, sway, Mesa and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb sway xwayland grim dbus python3-gi python3-pil gir1.2-glib-2.0 libgl1-mesa-dri libegl-mesa0 libxkbcommon-tools ffmpeg
      - name: The id the edge build keeps its files under
        run: |
          bin=$(command -v orden || command -v nib)
          id=$(grep -aoE '"identifier": ?"[^"]+"' "$(readlink -f "$bin")" | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          test -n "$id"
          echo "DRIVEN_ID=$id" >> "$GITHUB_ENV"
          echo "DRIVEN_BIN=$bin" >> "$GITHUB_ENV"
          echo "the edge build is $id"
      - name: What
        env:
          OUT: wayland-out/418-webkitgtk
          CHECK: '1'
          CLASS: ''
        run: dbus-run-session -- bash scripts/wayland-launch.sh "$DRIVEN_BIN"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wayland-webkitgtk
          path: wayland-out
          if-no-files-found: ignore

  appimage:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: sway, Mesa and a session bus, as Arch has them today
        run: |
          pacman -Syu --noconfirm --needed sway xorg-xwayland mesa dbus python git alsa-lib nss
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Unpacked
        run: |
          cd packages/appimage
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          [ -d squashfs-root ] || mv AppDir squashfs-root
      - name: Under Wayland with no portal, `--quick-add` reaching the running app
        env:
          OUT: wayland-out
          KEYS: 'no desktop portal'
          ORDEN_CEF_SANDBOX: disabled
        run: |
          app="$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
          SECOND="$app --quick-add" dbus-run-session -- bash scripts/wayland-launch.sh "$app"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wayland-appimage
          path: wayland-out
          if-no-files-found: ignore

  fedora-44:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read
    steps:
      - name: sway, Xvfb, Mesa and a session bus, as Fedora 44 has them
        run: |
          dnf install -y sway xorg-x11-server-Xwayland xorg-x11-server-Xvfb xdpyinfo xwininfo mesa-dri-drivers mesa-libEGL mesa-libgbm libglvnd-egl dbus-daemon dbus-tools python3 python3-pillow grim ImageMagick git
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
          rpm -q mesa-libgbm libglvnd
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Unpacked
        run: |
          cd packages/appimage
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          [ -d squashfs-root ] || mv AppDir squashfs-root
      - name: Under Wayland
        env:
          OUT: fedora-out/wayland
          ORDEN_CEF_SANDBOX: disabled
          IDLE: '1'
        run: dbus-run-session -- bash scripts/wayland-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - name: Under X11
        if: always()
        env:
          OUT: fedora-out/x11
          ORDEN_CEF_SANDBOX: disabled
          IDLE: '1'
        run: dbus-run-session -- bash scripts/x11-launch.sh "$GITHUB_WORKSPACE/packages/appimage/squashfs-root/AppRun"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fedora-44
          path: fedora-out
          if-no-files-found: ignore

  rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: The .rpm, sway, Mesa and a session bus
        run: |
          dnf install -y ./packages/rpm/*.rpm sway xorg-x11-server-Xwayland mesa-dri-drivers mesa-libEGL dbus-daemon dbus-tools python3
          install -m 755 "$(command -v sway)" /usr/local/bin/sway
      - name: The .rpm runs as orden, and as nib for the release after the rename
        run: |
          test -x /usr/bin/orden
          test -x /usr/bin/nib
          grep -qx 'exec /usr/bin/orden "$@"' /usr/bin/nib
          grep -qx 'exec /usr/bin/orden "$@"' /usr/share/Orden/nib
      - name: The .rpm gives no file type an icon or a definition, Orden owning none
        run: |
          if rpm -qlp packages/rpm/*.rpm | grep -E '/mimetypes/|/mime/packages/'; then
            echo "::error::the .rpm carries an icon or a definition for a file type"
            exit 1
          fi
      - name: Under Wayland
        env:
          OUT: wayland-out
          ORDEN_CEF_SANDBOX: disabled
        run: dbus-run-session -- bash scripts/wayland-launch.sh /usr/bin/orden
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wayland-rpm
          path: wayland-out
          if-no-files-found: ignore
