name: electron-runtime

on:
  push:
    branches: [main, unstable, 'tmp/ci-*']
    paths:
      - .github/workflows/electron-runtime.yml
      - apps/desktop/src-tauri/linux/tauri-runtime-electron/**
      - apps/desktop/src-tauri/linux/Cargo.toml
      - apps/desktop/src-tauri/linux/Cargo.lock
      - apps/desktop/src-tauri/src/lib.rs
      - apps/desktop/src-tauri/src/engine_electron.rs
      - apps/desktop/src-tauri/tests/electron_core.rs
      - scripts/linux-manifest.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/electron-runtime.yml
      - apps/desktop/src-tauri/linux/tauri-runtime-electron/**
      - apps/desktop/src-tauri/linux/Cargo.toml
      - apps/desktop/src-tauri/linux/Cargo.lock
      - apps/desktop/src-tauri/src/lib.rs
      - apps/desktop/src-tauri/src/engine_electron.rs
      - apps/desktop/src-tauri/tests/electron_core.rs
      - scripts/linux-manifest.mjs
  workflow_dispatch:

concurrency:
  group: electron-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri/linux/tauri-runtime-electron
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: |
            apps/desktop/src-tauri/linux/tauri-runtime-electron
          save-if: ${{ github.ref == 'refs/heads/unstable' }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy

      - name: The desktop manifest
        run: |
          node scripts/linux-manifest.mjs --check
          bash scripts/linux-cef.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: |
            apps/desktop/src-tauri
          key: electron
          save-if: ${{ github.ref == 'refs/heads/unstable' }}

      - name: System dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt.sh --no-install-recommends libdbus-1-dev libwayland-dev

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features --features electron

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features --features electron --lib --bins --test electron_core -- -D warnings

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features --features electron --test electron_core
