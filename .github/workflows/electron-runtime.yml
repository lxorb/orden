name: electron-runtime

on:
  push:
    branches: [main, unstable, 'tmp/ci-*']
    paths:
      - .github/workflows/electron-runtime.yml
      - apps/desktop/src-tauri/linux/tauri-runtime-electron/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/electron-runtime.yml
      - apps/desktop/src-tauri/linux/tauri-runtime-electron/**
  workflow_dispatch:

concurrency:
  group: electron-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri/linux/tauri-runtime-electron
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: |
            apps/desktop/src-tauri/linux/tauri-runtime-electron
          save-if: ${{ github.ref == 'refs/heads/unstable' }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
