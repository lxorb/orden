name: osr spike

on:
  push:
    branches: ['tmp/ci-2291*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: spikes/osr
          key: ${{ matrix.target }}

      - name: The CEF distribution
        run: bash scripts/linux-cef.sh cef

      - name: Build
        run: cargo build --release --manifest-path spikes/osr/Cargo.toml

      - name: Measure
        run: |
          python -m pip install --quiet psutil
          python spikes/osr/drive.py --exe "$(cygpath -w "$PWD/spikes/osr/target/release/osr-spike.exe")" --out spike-out --label ${{ matrix.runner }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osr-spike-${{ matrix.runner }}
          path: spike-out
          if-no-files-found: ignore
