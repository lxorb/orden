name: walks

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: walks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  walks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ten thousand new seeds
        run: SIM_FROM=$(( $(date +%s) / 86400 * 10000 )) pnpm --filter @orden/desktop sim:long

  crowds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mix: [tree, order]
        side: ['@orden/desktop', '@orden/sync-core']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ten thousand new seeds on three to eight devices
        env:
          SIM_MIX: ${{ matrix.mix }}
          SIDE: ${{ matrix.side }}
        run: SIM_FROM=$(( $(date +%s) / 86400 * 10000 )) pnpm --filter "$SIDE" sim:long
