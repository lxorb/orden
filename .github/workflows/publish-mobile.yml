name: publish-mobile

on:
  push:
    tags: ['v*']
    branches: [unstable]
  workflow_dispatch:

concurrency:
  group: publish-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/unstable' }}

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      rolling: ${{ steps.decide.outputs.rolling }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: bash scripts/build-version.sh

  android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          shared-key: android

      - run: pnpm install --frozen-lockfile

      - name: A key to sign with
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$KEYSTORE" ] && [ "$REPOSITORY" = lxorb/orden ]; then
            echo "::error::ANDROID_KEYSTORE is not set: an APK signed with a key of its own cannot replace the installed one."
            exit 1
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d >release.jks
            store=$PWD/release.jks
            password=$KEYSTORE_PASSWORD
            alias=${KEY_ALIAS:-nib}
          else
            store=$PWD/edge.jks
            password=nib-edge
            alias=nib
            keytool -genkeypair -keystore "$store" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$password" -keypass "$password" \
              -dname 'CN=Orden, O=Emil Vinu'
          fi

          {
            echo "storeFile=$store"
            echo "storePassword=$password"
            echo "keyAlias=$alias"
            echo "keyPassword=$password"
          } >keystore.properties

      - name: Build the APK
        run: |
          pnpm --filter @orden/desktop exec tauri android build --apk \
            --target aarch64 --target x86_64 \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - name: Clippy for the phone
        run: |
          ndk="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_aarch64_linux_android="$ndk/aarch64-linux-android24-clang" \
          AR_aarch64_linux_android="$ndk/llvm-ar" \
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target aarch64-linux-android -- -D warnings

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nib-android
          if-no-files-found: error
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  ios:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri
          key: ios

      - run: pnpm install --frozen-lockfile

      - name: The Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'AAAAAAAAAA' }}
        run: pnpm --filter @orden/desktop exec tauri ios init

      - name: The app's own icons
        run: |
          cp apps/desktop/src-tauri/icons/ios/*.png \
            apps/desktop/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/

      - name: Build for the simulator
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'AAAAAAAAAA' }}
        run: |
          pnpm --filter @orden/desktop exec tauri ios build --target aarch64-sim \
            --config '{"version":"${{ needs.version.outputs.version }}"}'

      - name: Build for a phone
        run: |
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --lib --release --target aarch64-apple-ios

      - name: Clippy for the phone
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target aarch64-apple-ios -- -D warnings

      - name: Collect what was built
        run: |
          mkdir -p out
          app=$(find apps/desktop/src-tauri/gen/apple/build -maxdepth 4 -name '*.app' | head -1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" out/ios-simulator.app.zip
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nib-ios
          if-no-files-found: error
          path: out/*.zip

  publish:
    needs: [version, android, ios]
    if: github.ref == 'refs/heads/unstable' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      ROLLING: ${{ needs.version.outputs.rolling }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: artifacts }

      - name: Name the downloads for humans
        run: |
          mkdir -p uploads
          find artifacts -type f | while read -r file; do
            name=$(basename "$file")
            case "$name" in
              app-universal-release.apk)
                name=android.apk
                ;;
              app-*-release.apk)
                name=${name#app-}
                name="android-${name%-release.apk}.apk"
                ;;
              *.app.zip)
                [ "$ROLLING" = true ] || continue
                ;;
            esac
            cp "$file" "uploads/Orden-$VERSION-$name"
          done
          ls -l uploads

      - name: Wait for the release
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::$TAG has no release: release.yml makes it"
          exit 1

      - name: Upload the files
        run: gh release upload "$TAG" uploads/* --clobber

      - name: Take the last build's files off edge
        if: needs.version.outputs.rolling == 'true'
        run: find uploads -type f -printf '%f\n' | bash scripts/prune-edge.sh "$TAG" phone
