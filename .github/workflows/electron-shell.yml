name: electron-shell

on:
  push:
    branches: [unstable, 'tmp/ci-*']
    paths:
      - .github/workflows/electron-shell.yml
      - apps/desktop-electron/**
      - apps/desktop/src-tauri/linux/tauri-runtime-electron/**
      - apps/desktop/src-tauri/src/engine_electron.rs
  workflow_dispatch:
    inputs:
      os:
        description: 'The runners to build and drive on, as a JSON list'
        default: '["ubuntu-24.04","windows-latest","macos-latest"]'

concurrency:
  group: electron-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TAURI_CONFIG: '{"identifier":"so.orden.Orden.Electron"}'
      ORDEN_USAGE: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: The desktop manifest
        run: bash scripts/linux-cef.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          env-vars: ImageVersion
          workspaces: |
            apps/desktop/src-tauri
          key: electron-shell
          save-if: ${{ github.ref == 'refs/heads/unstable' }}

      - name: System dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt.sh --no-install-recommends libdbus-1-dev libwayland-dev xvfb dbus-x11

      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orden/desktop build

      - name: Core
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features --features electron

      - name: Shell
        working-directory: apps/desktop-electron
        run: |
          pnpm run electron
          pnpm build
          pnpm check
          pnpm test
          suffix=""
          [ "$RUNNER_OS" = Windows ] && suffix=.exe
          node pack.ts "../desktop/src-tauri/target/debug/orden$suffix"

      - name: Drive
        working-directory: apps/desktop-electron
        run: |
          case "$RUNNER_OS" in
            Linux)
              xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
                node test/drive.ts --shell dist/orden-electron/electron --home "$RUNNER_TEMP/home" --arg=--no-sandbox
              ;;
            Windows) node test/drive.ts --shell dist/orden-electron/electron.exe ;;
            macOS) node test/drive.ts --shell dist/orden-electron/Electron.app/Contents/MacOS/Electron ;;
          esac

      - name: Package
        if: always()
        working-directory: apps/desktop-electron/dist
        run: tar -czf "orden-electron-$RUNNER_OS-$RUNNER_ARCH.tar.gz" orden-electron

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-shell-drive-${{ matrix.os }}
          path: apps/desktop-electron/dist/drive
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-shell-app-${{ matrix.os }}
          path: apps/desktop-electron/dist/orden-electron-*.tar.gz
          retention-days: 14
          compression-level: 0
