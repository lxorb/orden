name: upgrade

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/desktop/src-tauri/installer.nsh
      - apps/desktop/src-tauri/installer-close.ps1
      - apps/desktop/src-tauri/wix/**
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/crates/system/src/bundle_name.rs
      - apps/desktop/src-tauri/crates/system/src/default_browser.rs
      - apps/desktop/src-tauri/tauri.windows.conf.json
      - apps/desktop/src-tauri/Info.plist
      - apps/desktop/src-tauri/icons/documents/**
      - apps/desktop/src-tauri/crates/system/src/updates.rs
      - scripts/windows-upgrade.ps1
      - scripts/windows-arch-move.ps1
      - scripts/stop-app.sh
      - .github/workflows/upgrade.yml

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIRST: '0.14.0'
  ORDEN: '0.22.4'
  NEW: '0.99.0'

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            label: windows
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            label: windows-arm64
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            label: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/desktop-setup
        with:
          target: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          config="{\"version\":\"$NEW\",\"bundle\":{\"createUpdaterArtifacts\":false}}"
          bash scripts/linux-cef.sh tauri build --bundles ${{ matrix.bundles }} \
            --ignore-version-mismatches --config "$config"

      - name: Pack the app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/release/bundle/macos
        run: tar -czf app.tgz *.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: new-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/macos/app.tgz

  windows:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        from: [FIRST, ORDEN]
        scenario: [updater, silent, elsewhere, msi]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: new-windows
          path: new

      - name: The old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ env[matrix.from] }}
        run: |
          gh release download "v$OLD_VERSION" --repo "$GITHUB_REPOSITORY" --dir old \
            --pattern "*-$OLD_VERSION-windows-x64-setup.exe" --pattern "*-$OLD_VERSION-windows-x64.msi"
          curl -fsSL -o SFTA.ps1 \
            https://raw.githubusercontent.com/DanysysTeam/PS-SFTA/22a32292e576afc976a1167d92b50741ef523066/SFTA.ps1
          echo '3eb6f6dee3fd8c91604042060b9d658f08ec85d3fd0a14769119dfd78bc30851  SFTA.ps1' | sha256sum -c
          find new old -type f

      - name: From ${{ env[matrix.from] }}, ${{ matrix.scenario }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem new -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $msi = Get-ChildItem new -Recurse -Filter '*.msi' | Select-Object -First 1
          New-Item -ItemType Directory -Force flat | Out-Null
          Copy-Item $setup.FullName, $msi.FullName flat
          ./scripts/windows-upgrade.ps1 -Scenario ${{ matrix.scenario }} -Old old -New flat -Sfta ./SFTA.ps1

  windows-arm64:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: new-windows-arm64
          path: new

      - name: The x64 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$ORDEN" --repo "$GITHUB_REPOSITORY" --dir old --pattern "*-$ORDEN-windows-x64-setup.exe"
          find new old -type f

      - name: An x64 install on an arm64 machine updates to the arm64 build
        shell: pwsh
        run: ./scripts/windows-arch-move.ps1 -Old old -New new

  macos:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        from: [FIRST, ORDEN]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: scripts/stop-app.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: new-macos
          path: new

      - name: The old release
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ env[matrix.from] }}
        run: |
          gh release download "v$OLD_VERSION" --repo "$GITHUB_REPOSITORY" --dir old \
            --pattern "*-$OLD_VERSION-macos-universal.dmg" --pattern "*-$OLD_VERSION-macos-arm64.dmg"
          hdiutil attach -nobrowse -mountpoint /tmp/old old/*.dmg
          find new -type f
          tar -x -z -f "$(find new -name app.tgz | head -1)" -C new
          ls /tmp/old new

      - name: A PDF shows Orden's PDF document icon where Orden is its reader
        run: |
          set -u
          plist=new/Orden.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeIconFile' "$plist")" = pdf.icns
          test -s new/Orden.app/Contents/Resources/pdf.icns
          test "$(head -c 4 new/Orden.app/Contents/Resources/pdf.icns)" = icns

      - name: Updated in place, then launched
        run: |
          set -u
          apps="$HOME/Applications"
          mkdir -p "$apps"
          ditto /tmp/old/Orden.app "$apps/Orden.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$apps/Orden.app/Contents/Info.plist"

          rm -rf "$apps/Orden.app"
          ditto new/Orden.app "$apps/Orden.app"
          open "$apps/Orden.app"

          for _ in $(seq 60); do
            pgrep -fl "$apps/Orden.app/Contents/MacOS/" && break
            sleep 1
          done
          ls "$apps"
          pgrep -fl "$apps/Orden.app/Contents/MacOS/" || { echo 'it did not start from Orden.app'; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$apps/Orden.app/Contents/Info.plist")" = Orden
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$apps/Orden.app/Contents/Info.plist")" = "$NEW"
          osascript -e 'quit app id "so.orden.Orden"' || true
          sleep 3
          . scripts/stop-app.sh && stop_app "$apps/Orden.app/Contents/MacOS/"

      - name: What happened
        if: failure()
        run: |
          ps axww | grep -i '[o]rden' || true
          ls -la "$HOME/Applications" || true
          find "$HOME/Library/Logs" -path '*so.orden.Orden*' -type f -exec sh -c 'echo "== $1"; tail -80 "$1"' sh {} \; || true
          find "$HOME/Library/Logs/DiagnosticReports" -newer /tmp/old -type f -exec sh -c 'echo "== $1"; head -80 "$1"' sh {} \; || true
          log show --last 5m --predicate 'process == "orden" OR eventMessage CONTAINS "Orden.app"' --style compact 2>/dev/null | tail -80 || true
