name: publish-linux

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish (e.g. v0.4.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (e.g. v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  aur:
    name: AUR (orden-bin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-') }}
    env:
      TAG: ${{ inputs.tag }}
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Point the PKGBUILD at this release
        working-directory: packaging/aur/nib-bin
        shell: bash
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          sum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }
          x64=$(sum "$base/Orden-$version-linux-x64.deb")
          arm64=$(sum "$base/Orden-$version-linux-arm64.deb")
          desktop=$(sha256sum nib.desktop | cut -d' ' -f1)

          sed -i \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$desktop')/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm64')/" \
            PKGBUILD
          cat PKGBUILD

      - name: Check it still builds, before anything is pushed
        env:
          ARCH_IMAGE: archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
        run: |
          cat > /tmp/aur.sh <<'SH'
          set -euo pipefail
          pacman -Syu --noconfirm --needed namcap sudo
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser
          chmod 440 /etc/sudoers.d/builduser
          install -d /build && cp -r /repo/packaging/aur/nib-bin/. /build/
          chown -R builduser: /build
          cd /build
          sudo -u builduser makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO
          sudo -u builduser makepkg -f --noconfirm --syncdeps --noprogressbar
          namcap ./*.pkg.tar.zst
          SH
          docker run --rm -v "$PWD:/repo" -v /tmp/aur.sh:/aur.sh "$ARCH_IMAGE" bash /aur.sh

      - name: Push to the AUR
        if: env.HAS_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: orden-bin
          pkgbuild: packaging/aur/nib-bin/PKGBUILD
          assets: packaging/aur/nib-bin/nib.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: orden ${{ env.TAG }}

      - name: No AUR key yet
        if: env.HAS_KEY != 'true'
        run: |
          echo "### AUR not published" >> "$GITHUB_STEP_SUMMARY"
          echo "The PKGBUILD builds, but AUR_SSH_PRIVATE_KEY is not set, so nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "See packaging/linux.md for how to create the account and add the secrets." >> "$GITHUB_STEP_SUMMARY"

  snap:
    if: ${{ startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
