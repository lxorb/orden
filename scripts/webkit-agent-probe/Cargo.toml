[package]
name = "webkit-agent-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace]

[dependencies]
wry = "=0.55.1"
tao = "=0.35.3"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"
gtk = "0.18"
cairo-rs = "0.18"
